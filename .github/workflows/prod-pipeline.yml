name: PROD Pipeline

on:
  push:
    branches:
      - '*-prod'

jobs:
  build:
    name: Build PROD
    # runs-on: [self-hosted, Linux, aws]
    runs-on:
      labels: ubuntu-24.04-16core

    strategy:
      matrix:
        node-version: [12.x]

    steps:
      - run: free -h
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # - name: Setup npm registry
      #   run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Fix asset path case sensitivity
        run: ln -s illustrations src/assets/image/icons/homepage/Illustrations

      - name: Build for PROD
        run: npm run build-prod

      - name: Prepare ui artifact directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/ui"
          cp -R ../dist/ui "$GITHUB_WORKSPACE/ui"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-ui
          path: ui

  publish:
    name: Trigger Jenkins Job
    runs-on: ubuntu-latest
    needs: build
    environment: PROD

    steps:
      - name: Trigger Jenkins
        uses: appleboy/jenkins-action@v1
        with:
          url: ${{ vars.JENKINS_URL }}
          user: ${{ vars.JENKINS_USER }}
          token: ${{ secrets.JENKINS_TOKEN }}
          job: ${{ vars.JENKINS_JOB_NAME }}
          parameters: |
            BRANCH=${{ github.ref_name }}
