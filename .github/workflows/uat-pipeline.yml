name: UAT Pipeline

on:
  push:
    branches:
      - UAT

jobs:
  build:
    name: Build UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Setup npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Remove lock files
        run: rm -f package-lock.json yarn.lock

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node12-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node12-

      - name: Install dependencies
        run: npm install

      - name: Fix asset path case sensitivity
        run: ln -s illustrations src/assets/image/icons/homepage/Illustrations

      - name: Build for UAT
        run: node --max_old_space_size=6144 ./node_modules/@angular/cli/bin/ng build --prod --configuration=uat

      - name: Package ui.zip
        run: |
          cd ../dist
          zip -r ../ui.zip ui
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-ui-zip
          path: ui.zip

  publish:
    name: Publish (Placeholder)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download ui.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: uat-ui-zip
