name: UAT Pipeline

on:
  push:
    branches:
      - UAT

environment: UAT

jobs:
  build:
    name: Build UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Setup npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node12-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node12-

      - name: Install dependencies
        run: npm install

      - name: Fix asset path case sensitivity
        run: ln -s illustrations src/assets/image/icons/homepage/Illustrations

      - name: Build for UAT
        run: node --max_old_space_size=4096 ./node_modules/@angular/cli/bin/ng build --configuration=uat --aot=false --optimization=false --build-optimizer=false --source-map=false --vendor-chunk=true

      - name: Package ui.zip
        run: |
          cd ../dist
          zip -r "$GITHUB_WORKSPACE/ui.zip" ui

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-ui-zip
          path: ui.zip

  publish:
    name: Trigger Jenkins Job
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigger Jenkins
        uses: appleboy/jenkins-action@v1
        with:
          url: ${{ vars.JENKINS_URL }}
          user: ${{ vars.JENKINS_USER }}
          token: ${{ secrets.JENKINS_TOKEN }}
          job: ${{ secrets.JENKINS_JOB_NAME }}
          params: "BRANCH=${{ github.ref_name }}"
