# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    # runs-on: [self-hosted, Linux]
    runs-on: [self-hosted]
    environment: github-pages

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # cache: 'npm'
    - run: export TZ=Asia/Shanghai
    - run: npm -g install @angular/cli
    - run: npm i
    - run: ng build --aot #npm run build --if-present
    # - run: npm test

    # aws s3
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION}}
    - name: S3Upload
      run: |
        aws s3 cp --recursive dist/workflow-designer-angular-sample \
            s3://${{secrets.AWS_S3_BUCKET}}/workflow-designer-angular/${GITHUB_SHA:0:7}

    - name: Setup Pages
      uses: actions/configure-pages@v5
    # - name: Upload artifact
    #   uses: actions/upload-pages-artifact@v3
    #   with:
    #     path: './dist/workflow-designer-angular-sample'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
