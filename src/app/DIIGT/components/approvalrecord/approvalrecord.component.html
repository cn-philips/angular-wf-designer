<table  border="1" cellspacing="0">
  <tr>
    <td>步骤</td>
    <td>操作着</td>
    <td>审批结果</td>
    <td>备注</td>
    <td>操作时间</td>
  </tr>
  <tr *ngFor="let it of row2; let index = index">
    <td>{{it.name}}</td>
    <td>{{it.taker}}</td>
    <td [ngClass]="it.end=='待提交'||it.end=='待审批'?'red':'green'">{{it.end}}</td>
    <td>{{it.ts}}</td>
    <td>{{it.time}}</td>
  </tr>
</table>
<div class="tr mt10">
  <button *ngIf="!isDisable" nz-button class="submit" nzType="primary" (click)="next()">Next 下一步</button>
</div>
