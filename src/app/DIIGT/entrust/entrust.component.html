<nz-card class="title_warpper">
  <div>
    <h4 class="font-weight-bold">
      <span>我的委托</span>
    </h4>
  </div>
</nz-card>

<form nz-form [formGroup]="validateForm">
<nz-card class="mtb1rem">
  <nz-tabset
    [nzSelectedIndex]="tabIndex"
    [nzTabPosition]="'top'"
    [nzType]="'card'"
  >

    <nz-tab nzTitle="短期角色代理">
      <div class="short_new">
        <button nz-button [nzType]="'primary'">新建短期角色代理</button>
      </div>
      <div class="short_title">
      <div nz-col nzXs="24" nzSm="24" nzMd="16">
        <nz-form-item>
          <nz-form-control [nzSm]="4" [nzXs]="24" style="width: 130px">任务创建起止时间：</nz-form-control>
          <nz-form-control [nzSm]="12" [nzXs]="24" style="width: 380px">
            <nz-range-picker
              nzFormat="yyyy-MM-dd"
              formControlName="subDateShort"
            ></nz-range-picker>
          </nz-form-control>
          <nz-form-control [nzSm]="2" [nzXs]="24">
            <button nz-button [nzType]="'primary'" (click)="sub_Short(validateForm.value)">搜索</button>
          </nz-form-control>
        </nz-form-item>
      </div>
      </div>
      <div>

        <nz-table
          [nzScroll]="{ x: '2200px' }"
          [nzData]="tabListShort"
          [nzLoading]="loadingShort"
          [nzTotal]="paramsShort.total"
          [nzPageIndex]="paramsShort.pageNo"
          [nzPageSize]="paramsShort.pageSize"
          [nzShowTotal]="totalTemplateShort"
          [nzFrontPagination]="false"
          (nzPageIndexChange)="changePageIndexShort($event)"
          (nzPageSizeChange)="changePageSizeShort($event)"
          [nzHideOnSinglePage]="false"
          [nzPageSizeOptions]="[5, 10, 20, 30, 40, 50 ]"
          [nzShowQuickJumper]="true"
          [nzShowSizeChanger]="true"
        >
          <thead>
          <tr>
            <th nzAlign="center" nzWidth="40px">No.编号</th>
            <th nzAlign="center" nzWidth="40px">Description<br>委托描述</th>
            <th nzAlign="center" nzWidth="40px">Created Date<br>任务创建时间</th>
            <th nzAlign="center" nzWidth="40px">审批状态</th>
            <th nzAlign="center" nzWidth="40px">Start Date<br>开始时间</th>
            <th nzAlign="center" nzWidth="40px">End Date<br>结束时间</th>
            <th nzAlign="center" nzWidth="40px">Applicant<br>申请人</th>
            <th nzAlign="center" nzWidth="40px">原所有人</th>
            <th nzAlign="center" nzWidth="40px">Receiver<br>接收人</th>
            <th nzAlign="center" nzWidth="40px">Action操作</th>
          </tr>
          </thead>
        </nz-table>
        <ng-template #totalTemplateShort let-total> 数据总条数 {{ paramsShort.total }} </ng-template>

      </div>
    </nz-tab>
