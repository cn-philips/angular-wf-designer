<nz-modal
  [(nzVisible)]="isVisible"
  [nzTitle]="isCreate?'新增数据字典':'修改数据字典'"
  nzOkText="确定"
  nzCancelText="取消"
  nzWidth="800"
  nzCentered
  (nzOnOk)="checkForm(validateForm.value)"
  (nzOnCancel)="handleCancel()"
>
  <form nz-form [formGroup]="validateForm" (ngSubmit)="checkForm(validateForm.value)">
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="dictGroup">字典分组</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <input nz-input formControlName="dictGroup" id="dictGroup" [(ngModel)]="isCreate ? undefined: formData.dictGroup" />
        <nz-form-explain *ngIf="validateForm.get('dictGroup')?.dirty && validateForm.get('dictGroup')?.errors">
          请输入内容！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="dictKey">字典Key</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <input *ngIf="isCreate" nz-input formControlName="dictKey" id="dictKey" [(ngModel)]="isCreate ? undefined: formData.dictKey" />
        <input *ngIf="!isCreate" disabled nz-input formControlName="dictKey" id="dictKey" [(ngModel)]="isCreate ? undefined: formData.dictKey" />
        <nz-form-explain *ngIf="validateForm.get('dictKey')?.dirty && validateForm.get('dictKey')?.errors">
          请输入内容！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="dictLabel">字典标签</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <input nz-input formControlName="dictLabel" id="dictLabel" [(ngModel)]="isCreate ? undefined: formData.dictLabel" />
        <nz-form-explain *ngIf="validateForm.get('dictLabel')?.dirty && validateForm.get('dictLabel')?.errors">
          请输入内容！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="dictSort">排序</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <nz-select
          formControlName="dictSort"
          id="dictSort"
          [(ngModel)]="isCreate ? undefined: formData.dictSort"
          style="width: 100%;"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder=""
        >
          <nz-option
            *ngFor="let item of dictSortlList"
            [nzValue]="item.value"
            [nzLabel]="item.label"
          ></nz-option>
        </nz-select>
        <nz-form-explain *ngIf="validateForm.get('dictSort')?.dirty && validateForm.get('dictSort')?.errors">
          请选择选项！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="dictValue">字典键值</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <input nz-input formControlName="dictValue" id="dictValue" [(ngModel)]="isCreate ? undefined: formData.dictValue" />
        <nz-form-explain *ngIf="validateForm.get('dictValue')?.dirty && validateForm.get('dictValue')?.errors">
          请输入内容！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="isDefault">是否默认</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <nz-select
          formControlName="isDefault"
          id="isDefault"
          [(ngModel)]="isCreate ? undefined: formData.isDefault"
          style="width: 100%;"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder=""
        >
          <nz-option
            *ngFor="let item of isDefaultlList"
            [nzValue]="item.value"
            [nzLabel]="item.label"
          ></nz-option>
        </nz-select>
        <nz-form-explain *ngIf="validateForm.get('isDefault')?.dirty && validateForm.get('isDefault')?.errors">
          请选择选项！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
<!--    <nz-form-item>-->
<!--      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="isDeleted">是否删除</nz-form-label>-->

<!--          请选择选项！-->
<!--        </nz-form-explain>-->
<!--      </nz-form-control>-->
<!--    </nz-form-item>-->
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="status">状态</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <nz-select
          formControlName="status"
          id="status"
          [(ngModel)]="isCreate ? undefined : formData.status"
          style="width: 100%;"
          nzShowSearch
          nzAllowClear
          nzPlaceHolder=""
        >
          <nz-option
            *ngFor="let item of statusList"
            [nzValue]="item.value"
            [nzLabel]="item.label"
          ></nz-option>
        </nz-select>
        <nz-form-explain *ngIf="validateForm.get('status')?.dirty && validateForm.get('status')?.errors">
          请选择选项！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="remark">备注</nz-form-label>
      <nz-form-control [nzSm]="14" [nzXs]="24">
        <textarea nz-input placeholder="" formControlName="remark" id="remark" [(ngModel)]="isCreate ? undefined: formData.remark" [nzAutosize]="{ minRows: 3, maxRows: 6 }"></textarea>
        <nz-form-explain *ngIf="validateForm.get('remark')?.dirty && validateForm.get('remark')?.errors">
          请输入内容！
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
  </form>
</nz-modal>
