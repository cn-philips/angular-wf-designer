<app-apploading [load]="load"></app-apploading>
<h4 class="font-weight-bold py-3 mb-4">
  修改进单准备表
</h4>
<igt-approval-flowline></igt-approval-flowline>
<hr class="border-light container-m--x mt-0 mb-4">

<div class="tabs-box">
  <app-apploading [load]="load"></app-apploading>
  <div nz-row nzType="flex" nzJustify="end" nzAlign="middle" class="tabs-box-actions">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right;">
          <button *ngIf="dataBase.detail.flag!='1'" nz-button nzType="default" (click)="saveContract()" style="margin-right:10px;">保存</button>
          <button *ngIf="dataBase.entryMode !== 'STOCK'&&dataBase.detail.flag!='1'" nz-button nzType="primary" (click)="winningBid()">校验中标结果并提交</button>
          <button *ngIf="dataBase.entryMode === 'STOCK'&&dataBase.detail.flag!='1'" nz-button nzType="primary" (click)="handleOkWinCheck()">提交进单准备表</button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <ngb-tabset type="tabs" [destroyOnHide]="false" (tabChange)="tabclick($event)" [activeId]="activedId"
    class="nav-tabs-top nav-responsive-xl">
    <ngb-tab id="pending-tab">
      <ng-template ngbTabTitle><span class="tab-title"><strong>基础信息</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <div class="demo-vertical-spacing">
            <form #searchForm="ngForm">
              <app-preOrderBaseInfo
                #childbase [disa]="disa"
                [edit]="edit"
                [dataBase]="dataBase"
                (updateData)="updateData($event)"
                (myEvent)="myskip($event)">
              </app-preOrderBaseInfo>
            </form>
          </div>
        </div>
        <div class="tr mb10 mr10">
           <button nz-button [nzType]="'primary'" (click)="myskip('complete-tab')">下一步</button>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab id="complete-tab">
      <ng-template ngbTabTitle><span class="tab-title"><strong>产品信息</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-preOrderProductInfo [edit]="edit" [disa]="disa" [completed]="completed" [dataBase]="dataBase" (myEvent)="myskip($event)"></app-preOrderProductInfo>
        </div>
        <div class="tr mb10 mr10">
          <button nz-button [nzType]="'primary'" (click)="myskip('pending-tab')">上一步</button>
          <button *ngIf="completed" nz-button [nzType]="'primary'" (click)="myskip('complete-record')">下一步</button>
       </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab *ngIf="completed" id="complete-record">
      <ng-template ngbTabTitle><span class="tab-title"><strong>审批</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <nz-card class="mtb1rem" nzTitle="审批记录">
            <app-emp-acc></app-emp-acc>
            <div class="pr tr mt10">
              <button nz-button class="nextbtn ml6" nzType="primary" (click)="myskip('complete-tab')">上一步</button>
              <button nz-button class="nextbtn ml6" nzType="primary" (click)="myskip('complete-remarks')">下一步</button>
            </div>
          </nz-card>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab *ngIf="completed" id="complete-remarks">
      <ng-template ngbTabTitle><span class="tab-title"><strong>修改备注</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-apply-remarks #remarks [dataBase]="dataBase" (myEvent)="myskip($event)"></app-apply-remarks>
        </div>
        <div class="tr mb10 mr10">
          <button nz-button class="nextbtn ml6" nzType="primary" (click)="myskip('complete-record')">上一步</button>
        </div>
      </ng-template>
    </ngb-tab>
  </ngb-tabset>
  <!-- <button nz-button nzType="primary" class="save" (click)="cancelContract()">取消</button> -->
  <!-- <button nz-button nzType="primary" class="save" (click)="saveContract()">保存</button>
  <button *ngIf="dataBase.entryMode !== 'stock'" class="save" nz-button nzType="primary" (click)="winningBid()">校验中标结果并提交</button>
  <button *ngIf="dataBase.entryMode === 'stock'" class="submit" nz-button nzType="primary" (click)="handleOkWinCheck()">提交进单准备表</button> -->
  <nz-modal [(nzVisible)]="isVisibleWinCheck" [nzOkDisabled]="verifiOff" nzTitle="中标确认校验结果" nzOkText="提交进单准备表" nzCancelText="取消" nzCentered nzWidth="1600" (nzOnCancel)="handleCancelWinCheck()" (nzOnOk)="handleOkWinCheck()">
    <ng-container>
        <app-preOrderWinCheckTable (myVerifi)="myVerifi($event)" [bidData]="bidData" [businessModel]="dataBase.businessModel" [tableLoad]="tableLoad"></app-preOrderWinCheckTable>
    </ng-container>
  </nz-modal>
</div>
