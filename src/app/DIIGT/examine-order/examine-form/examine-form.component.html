<form nz-form [formGroup]="validateForm">
  <app-apploading [load]="load"></app-apploading>
  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="4" [nzXs]="24" style="min-width: 160px">备注</nz-form-label>
        <nz-form-control [nzSm]="8" [nzXs]="24">
          <textarea nz-input oninput="if(value.length>255)value=value.slice(0,255)" nz-input placeholder=""
            formControlName="remark" [(ngModel)]="params.remark" [nzAutosize]="{ minRows: 3, maxRows: 6 }"></textarea>
          <div>还可以输入:{{params.remark.length}}/{{textLen}}</div>
          <nz-form-explain *ngIf="validateForm.get('remark')?.dirty && validateForm.get('remark')?.errors">
           {{this.cannel?'请填写取消理由':'请填写拒绝理由'}} 
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="4" [nzXs]="24" style="min-width: 160px">审核支持文件</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <div class="maxuploadto">
          <nz-upload [(nzFileList)]="fileFileList" [nzBeforeUpload]="fileBeforeUpload" [nzLimit]="1"
            [nzPreview]="dwonLoad">
            <button [disabled]="dataBase.detail.flag == 1" nz-button><i nz-icon
                nzType="upload"></i><span>上传附件</span></button>
          </nz-upload>
          </div>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div
      *ngIf="dataBase.detail.status === 'DFBSH' && dataBase.detail.taskID === 'paymentProvision'&&roleCode==='C&C Leader'"
      nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="4" [nzXs]="24" nzRequired nzFor="paymentProvisionRadio">是否需要下一级审核</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <nz-radio-group formControlName="paymentProvisionRadio" [(ngModel)]="params.paymentProvisionRadio">
            <label nz-radio nzValue="1">是</label>
            <label nz-radio nzValue="0">否</label>
          </nz-radio-group>
          <nz-form-explain
            *ngIf="validateForm.get('paymentProvisionRadio')?.dirty && validateForm.get('paymentProvisionRadio')?.errors">
            请选择是否需要下一级审核
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <!-- <div *ngIf="dataBase.detail.status === 'DFBSH'" nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">当前审核操作</nz-form-label>
        <nz-form-control [nzSm]="14" [nzXs]="24">
          <input type="text" class="form-control" disabled value="" formControlName="taskID"
            [(ngModel)]="DfbshObj[params.taskID]">
        </nz-form-control>
      </nz-form-item>
    </div>
  </div> -->
  <div nz-row nzType="flex" nzJustify="end" nzAlign="middle">
    <div nz-col nzXs="24" nzSm="24" nzMd="16">
      <nz-form-item style="text-align: right;">
        <button *ngIf="dataBase.detail.flag==0&&withdraw&&dataBase.detail.status=='DHTOASH'" nz-button [nzType]="'primary'" style="margin-left: 10px;" nz-popconfirm
          nzTitle="你确定要执行取消进单的操作?" (nzOnConfirm)="sumbitBack(1)">取消进单</button>
        <button *ngIf="dataBase.detail.flag==0" nz-button [nzType]="'primary'" style="margin-left: 10px;" nz-popconfirm
          [nzTitle]="dataBase.detail.status=='DOAJDQR'?'你确定要执行确认的操作?':'你确定要执行通过的操作?'" (nzOnConfirm)="confirmApproval(validateForm.value, 1)"
          (nzOnCancel)="cancelAction()">{{this.dataBase.detail.status=="DOAJDQR"?"进单确认":"审核通过"}}</button>
        <button *ngIf="dataBase.detail.flag==0" nz-button [nzType]="'primary'" style="margin-left: 10px;" nz-popconfirm
          nzTitle="你确定要执行拒绝的操作?" (nzOnConfirm)="confirmApproval(validateForm.value, 0)"
          (nzOnCancel)="cancelAction()">拒绝</button>
      </nz-form-item>
    </div>
  </div>
</form>
