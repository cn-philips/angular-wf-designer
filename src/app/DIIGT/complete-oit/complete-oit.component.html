<h4 class="font-weight-bold py-3">
  <span>OIT完成</span>
</h4>
<app-apploading [load]="load"></app-apploading>
<igt-approval-flowline></igt-approval-flowline>
<div class="tabs-box">
  <div nz-row nzType="flex" nzJustify="end" nzAlign="middle" class="tabs-box-actions">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right;">
          <button nz-button *ngIf="flag==0&&!disa&&infor.detail.status=='DOITWJSC'" nzType="default" nz-popconfirm nzTitle="你确定要执行退回的操作?" (nzOnConfirm)="submit(0)" style="margin-right:10px;">退回</button>
          <button nz-button *ngIf="flag==0&&!disa&&infor.detail.status=='DOITWJSC'" nzType="default" (click)="submit(3)" style="margin-right:10px;">保存</button>
          <button nz-button *ngIf="flag==0&&!disa&&infor.detail.status=='DOITWJSC'" nzType="primary" (click)="submit(1)">提交</button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <ngb-tabset type="tabs"  [destroyOnHide]="false" [activeId]="activedId" (tabChange)="tabclick($event)" class="nav-tabs-top nav-responsive-xl">
    <ngb-tab id="pending-tab">
      <ng-template ngbTabTitle><span class="tab-title"><strong>合同概要表</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-preOrderBaseInfo
            [dataBase]="infor"
            [disa]="true"
            [conTable]="true"
            [showChek]="true"
          >
          </app-preOrderBaseInfo>
          <div nz-row class="mb10 mr10" nzType="flex" nzJustify="end" nzAlign="middle">
            <div nz-col nzSm="6" nzSpan="4">
              <nz-form-item>
                <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right;">
                  <button nz-button [nzType]="'primary'" (click)="myskip('complete-tab')">下一步</button>
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab id="complete-tab">
      <ng-template ngbTabTitle><span class="tab-title"><strong>Order Summary</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-inorder-in [dataBase]="dataBase"></app-inorder-in>
          <app-inorder-ex [disa]="true" [dataBase]="dataBase"></app-inorder-ex>
          <div class="tr  mb10 mr10">
            <button nz-button [nzType]="'primary'" (click)="myskip('pending-tab')">上一步</button>
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-pad')">下一步</button>
          </div>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab id="complete-pad">
      <ng-template ngbTabTitle><span class="tab-title"><strong>合同签署</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <!-- <app-contractsigning></app-contractsigning> -->
          <app-consign-consign [dataBase]="signingData" [mergeData]="mergeData" [disa]="true"></app-consign-consign>
          <div class="tr  mb10 mr10">
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-tab')">上一步</button>
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-pads')">下一步</button>
          </div>
        </div>
      </ng-template>

    </ngb-tab>
    <ngb-tab id="complete-pads">
      <ng-template ngbTabTitle><span class="tab-title"><strong>审批记录</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <nz-card class="mtb1rem" nzTitle="审批记录">
            <app-emp-acc></app-emp-acc>
          </nz-card>
          <div class="tr  mb10 mr10">
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-pad')">上一步</button>
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-padd')">下一步</button>
          </div>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab id="complete-padd">
      <ng-template ngbTabTitle><span class="tab-title"><strong>OIT完成</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-oitcomplete
            #childbase
            
            [oitInfor]="oitData"
            [disa]="true"
          ></app-oitcomplete>
          <div class="tr  mb10 mr10">
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-pads')">上一步</button>
            <button *ngIf="thirdOff" nz-button [nzType]="'primary'" (click)="myskip('complete-third')">下一步</button>
            <button *ngIf="realTimeOff" nz-button [nzType]="'primary'" (click)="myskip('complete-real')">下一步</button>
          </div>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab *ngIf="thirdOff" id="complete-third">
      <ng-template ngbTabTitle><span class="tab-title"><strong>第三方自采核查</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-thirdcheck></app-thirdcheck>
          <div class="tr  mb10 mr10">
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-padd')">上一步</button>
          </div>
        </div>
      </ng-template>
    </ngb-tab>
    <ngb-tab *ngIf="realTimeOff" id="complete-real">
      <ng-template ngbTabTitle><span class="tab-title"><strong>上传SO#</strong></span></ng-template>
      <ng-template ngbTabContent>
        <div class="card-body">
          <app-real-time></app-real-time>
          <div class="tr  mb10 mr10">
            <button nz-button [nzType]="'primary'" (click)="myskip('complete-padd')">上一步</button>
          </div>
        </div>
      </ng-template>
    </ngb-tab>
  </ngb-tabset>
</div>
