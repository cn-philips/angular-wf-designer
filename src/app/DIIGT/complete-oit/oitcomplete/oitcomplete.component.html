<app-apploading [load]="load"></app-apploading>
<form nz-form [formGroup]="validateForm">
  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24">需要后补特批支持文件</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-radio-group disabled formControlName="specialApprovalSupporting"
            [(ngModel)]="oitInfor.specialApprovalSupporting" nzName="radiogroup">
            <label [nzDisabled]="true" nz-radio nzValue="1">是</label>
            <label [nzDisabled]="true" nz-radio nzValue="0">否</label>
          </nz-radio-group>
        </nz-form-control>
      </nz-form-item>
    </div>
    <ng-container *ngIf="oitInfor.specialApprovalSupporting=='1'">
      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label [nzSm]="5" [nzXs]="24">特批支持文件名称</nz-form-label>
          <nz-form-control [nzSm]="7" [nzXs]="24">
            <textarea  nz-input placeholder="" [(ngModel)]="oitInfor.supportFileMissingFileName"
              formControlName="supportFileMissingFileName"></textarea>
            <!--<textarea
              *ngIf="!disa"
              disabled
              nz-input
              placeholder="请输入"
              [(ngModel)]="oitInfor.supportFileMissingFileName"
              formControlName="supportFileMissingFileName"
              [nzAutosize]="{ minRows: 4, maxRows: 8 }"
            ></textarea>-->
          </nz-form-control>
        </nz-form-item>
      </div>
    </ng-container>
    <div nz-col nzSpan="24" *ngIf="dataBase.businessModel=='DISTRIBUTOR'">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24">是否经销商第三方产品核查</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-radio-group formControlName="productVerification" [(ngModel)]="oitInfor.productVerification"
            nzName="radiogroup2">
            <label [nzDisabled]="true" nz-radio nzValue="1">是</label>
            <label [nzDisabled]="true" nz-radio nzValue="0">否</label>
          </nz-radio-group>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" nzRequired [nzXs]="24">需要发送邮件的物流专员</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-select formControlName="logistician" [(ngModel)]="oitInfor.logistician" nzAllowClear
            nzPlaceHolder="请选择人员">
            <nz-option *ngFor="let item of oitInfor.oMlist" [nzValue]="item.email" [nzLabel]="item.name"></nz-option>
          </nz-select>
          <nz-form-explain *ngIf="
          validateForm.get('logistician')?.dirty &&
          validateForm.get('logistician')?.errors
        ">
            此选项必填字段
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" nzRequired [nzXs]="24">进单时间</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-month-picker  style="width:100%" [nzStyle]="style" [disabled]="flag==1" formControlName="logisticsTime"
            [(ngModel)]="oitInfor.logisticsTime" nzPlaceHolder="Select month"></nz-month-picker>
            <!-- <nz-month-picker ngIf="dataBase.hsId" style="width:100%" [nzStyle]="style" [ngModelOptions]="{standalone: true}" [disabled]="true" formControlName="logisticsTime"
            [(ngModel)]="oitInfor.logisticsTime" nzPlaceHolder="Select month"></nz-month-picker> -->
          <nz-form-explain *ngIf="
          validateForm.get('logisticsTime')?.dirty &&
          validateForm.get('logisticsTime')?.errors
        ">
            此选项必填字段
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="email">备注</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24" nz-tooltip [nzTitle]="oitInfor.remark">
          <textarea nz-input placeholder="" [(ngModel)]="oitInfor.remark"
            oninput="if(value.length>255)value=value.slice(0,255)" formControlName="remark"
            [nzAutosize]="{ minRows: 2, maxRows: 6 }"></textarea>

          <div>还可以输入:{{oitInfor.remark.length}}/{{textLenone}}</div>
          <nz-form-explain *ngIf="validateForm.get('remark')?.dirty && validateForm.get('remark')?.errors">
            请填写退回理由
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label nzRequired [nzSm]="5" [nzXs]="24" nzFor="email">出口管制文件</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-upload *ngIf="this.status=='DOITWJSC'&&flag == 0" [(nzFileList)]="exportControlList"
            [nzBeforeUpload]="exportControlBeforeUpload" [nzLimit]="1" [nzRemove]="nzRemoveExportControl"
            [nzPreview]="dwonLoad">
            <button [disabled]="flag == 1" nz-button><i nz-icon nzType="upload"></i><span>上传附件</span></button>
          </nz-upload>
          <button *ngIf="(flag == 1&&oitInfor.exportControl)||(this.status!='DOITWJSC'&&oitInfor.exportControl)"
            nz-tooltip [nzTitle]="oitInfor.exportControlNames" class="down link-tesk" nz-button nzType="link"
            (click)="fileDwon(oitInfor.exportControl)">{{oitInfor.exportControlNames?oitInfor.exportControlNames:"文件下载"}}</button>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="email">其它文件</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <div class="flex">
            <nz-upload [(nzFileList)]="otherList" [nzBeforeUpload]="otherBeforeUpload" [nzLimit]="1"
              [nzRemove]="nzRemoveOther" [nzPreview]="dwonLoad">
              <button [disabled]="disas" nz-button><i nz-icon nzType="upload"></i><span>上传附件</span></button>
            </nz-upload>            
          </div>
          <!-- <button *ngIf="(flag == 1&&oitInfor.other)||(this.status!='DOITWJSC'&&oitInfor.other)" nz-tooltip [nzTitle]="oitInfor.otherNames" class="down link-tesk" nz-button nzType="link"
          (click)="fileDwon(oitInfor.other)">{{oitInfor.otherNames?oitInfor.otherNames:"文件下载"}}</button> -->
        </nz-form-control>
      </nz-form-item>
    </div>
    <div *ngIf="status!='DOITWJSC'"  nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24"  nzFor="email">De-book</nz-form-label>
        <nz-form-control [nzSm]="10" [nzXs]="24"> 
          <div class="reflex">
            <div class="reflex-radio">
              <ng-container *ngIf="debookFlag">
                <nz-radio-group  [ngModelOptions]="{standalone: true}" [disabled]="true" [(ngModel)]="oitInfor.deBook" nzName="radiogroup">
                  <label  nz-radio nzValue="1">是</label>
                  <label  nz-radio nzValue="0">否</label>
                </nz-radio-group>  
            </ng-container> 
            <ng-container *ngIf="!debookFlag">
              <nz-radio-group  [ngModelOptions]="{standalone: true}" [(ngModel)]="oitInfor.deBook" nzName="radiogroup">
                <label  nz-radio nzValue="1">是</label>
                <label  nz-radio nzValue="0">否</label>
              </nz-radio-group>  
          </ng-container> 
            </div>
            <div *ngIf="oitInfor.deBook=='1'" class="reflex-date">                    
              <nz-form-label [nzSm]="8" [nzXs]="24" nzRequired nzFor="email">De-book时间</nz-form-label>
              <nz-form-control [nzSm]="10" [nzXs]="24">
                <nz-month-picker style="width:100%" [nzStyle]="style"
                  formControlName="deBookDate" [(ngModel)]="oitInfor.deBookDate" nzPlaceHolder="Select month">
                </nz-month-picker>
              </nz-form-control>
            </div>
          </div>          
        </nz-form-control>
      </nz-form-item>
    </div>
    <div *ngIf="status!='DOITWJSC'&&debookFlags" nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="email">Re-book</nz-form-label>
        <nz-form-control [nzSm]="10" [nzXs]="24"> 
          <div class="reflex">
            <div class="reflex-radio">
              <ng-container *ngIf="rebookFlag">
                <nz-radio-group  [ngModelOptions]="{standalone: true}" [disabled]="true" [(ngModel)]="oitInfor.reBook" nzName="radiogroup">
                  <label  nz-radio nzValue="1">是</label>
                  <label  nz-radio nzValue="0">否</label>
                </nz-radio-group> 
            </ng-container> 
            <ng-container *ngIf="!rebookFlag">
              <nz-radio-group  [ngModelOptions]="{standalone: true}"  [(ngModel)]="oitInfor.reBook" nzName="radiogroup">
                <label  nz-radio nzValue="1">是</label>
                <label  nz-radio nzValue="0">否</label>
              </nz-radio-group> 
          </ng-container>  
            </div>
            <div *ngIf="oitInfor.reBook=='1'" class="reflex-date">                    
              <nz-form-label [nzSm]="8" [nzXs]="24" nzRequired nzFor="email">Re-book时间</nz-form-label>
              <nz-form-control [nzSm]="10" [nzXs]="24">
                <nz-month-picker style="width:100%" [nzStyle]="style" [nzDisabledDate]="disabledDate"
                  formControlName="reBookDate" [(ngModel)]="oitInfor.reBookDate" nzPlaceHolder="Select month">
                </nz-month-picker>
              </nz-form-control>
            </div>
          </div>          
        </nz-form-control>
      </nz-form-item>
    </div>
    <div *ngIf="!disas&&status!='DOITWJSC'" nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzNoColon]="true"  [nzSm]="5" [nzXs]="24" nzFor="email">  </nz-form-label>
        <nz-form-control [nzSm]="10" [nzXs]="24"> 
          <div class="reflex">
            <button nz-button  class="updata" nzType="primary"
                (click)="updata()">保存</button>                      
          </div>          
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24" nzFor="email">OIT 完成凭证文件</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-upload *ngIf="this.status=='DOITWJSC'" [(nzFileList)]="fileFileList" [nzBeforeUpload]="fileBeforeUpload"
            [nzLimit]="1" [nzRemove]="nzRemoveFile" [nzPreview]="dwonLoad">
            <button [disabled]="flag == 1" nz-button><i nz-icon nzType="upload"></i><span>上传附件</span></button>
          </nz-upload>
          <button *ngIf="(flag == 1&&oitInfor.file)||(this.status!='DOITWJSC'&&oitInfor.file)" nz-tooltip
            [nzTitle]="oitInfor.fileNames" class="down link-tesk" nz-button nzType="link"
            (click)="fileDwon(oitInfor.file)">{{oitInfor.fileNames?oitInfor.fileNames:"文件下载"}}</button>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="24" *ngIf="status=='DBCWJSC'||status=='OITENDDBCWJSC'">
      <nz-form-item>
        <nz-form-label [nzSm]="5" [nzXs]="24">特批支持文件已补齐</nz-form-label>
        <nz-form-control [nzSm]="7" [nzXs]="24">
          <nz-radio-group formControlName="specialSupportCompleted" [(ngModel)]="oitInfor.specialSupportCompleted"
            nzName="radiogroup2">
            <label nz-radio nzValue="1">是</label>
            <label nz-radio nzValue="0">否</label>
          </nz-radio-group>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>
