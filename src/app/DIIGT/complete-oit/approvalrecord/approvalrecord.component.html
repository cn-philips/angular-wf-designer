<nz-table #basicTable [nzData]="listOfData">
  <thead>
  <tr>
    <th>步骤</th>
    <th>操作者</th>
    <th>审批结果</th>
    <th>备注</th>
    <th>操作时间</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let data of basicTable.data">
    <td>{{ data.step }}</td>
    <td>{{ data.operator }}</td>
    <td>{{ data.approvalResults }}</td>
    <td>{{ data.remarks }}</td>
    <td>{{ data.operation }}</td>
  </tr>
  </tbody>
</nz-table>
