<h4 class="font-weight-bold py-3">
  <span>我可查看</span>
</h4>
<div class="card-container">
  <nz-tabset
    [nzSelectedIndex]="tabIndex"
    [nzTabPosition]="'top'"
    [nzType]="'card'"
  >
    <nz-tab nzTitle="我可查看">
      <nz-card
        [ngClass]="{ 'mtb1rem': true }"
      >
        <app-my-view-form (passFormValues)="updateParams($event)"  (exportEvent)="exportData()" (projectReportEvent)="projectReport()"></app-my-view-form>
        <app-my-view-table
          (updateTable)="updateDataList($event)"
          (setLoading)="getLoading($event)"
          [listOfMapData]="listOfMapData"
          [total]="total"
          [loading]="loading"
          [flag]="1"
        ></app-my-view-table>
      </nz-card>
    </nz-tab>
  </nz-tabset>
</div>
