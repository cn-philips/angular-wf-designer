<form nz-form [formGroup]="validateForm">
  <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7">Role</nz-form-label>
        <nz-form-control [nzSpan]="17">
<!--          <nz-select-->
<!--            disabled-->
<!--            nzSize="small"-->
<!--            formControlName="role"-->
<!--          >-->
<!--            <nz-option-->
<!--              *ngFor="let item of roleOptions"-->
<!--              [nzValue]="item.value"-->
<!--              [nzLabel]="item.label"-->
<!--            ></nz-option>-->
<!--          </nz-select>-->
          <input nz-input nzSize="small" formControlName="role" >
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook" >Team</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="team"
          >
            <nz-option
              *ngFor="let item of teamOptions"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
<!--          <input nz-input formControlName="team" nzSize="small">-->
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook" >Modality</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="modality"
          >
            <nz-option
              *ngFor="let item of modalityOptions"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook" >BMC</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="bmc"
          >
            <nz-option
              *ngFor="let item of bmcOptions"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook" >Cluster</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="cluster"
          >
            <nz-option nzValue="PD" nzLabel="PD"></nz-option>
            <nz-option nzValue="IGT" nzLabel="IGT"></nz-option>
            <nz-option nzValue="PD&IGT" nzLabel="PD&IGT"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>
