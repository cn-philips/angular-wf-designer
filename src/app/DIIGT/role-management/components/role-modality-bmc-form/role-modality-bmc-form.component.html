<form nz-form [formGroup]="validateForm">
  <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7">Role</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <input nz-input nzSize="small" formControlName="role" >
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook" >Team</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="team"
          >
            <nz-option
              *ngFor="let item of teamOptions"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
<!--          <input nz-input formControlName="team" nzSize="small">-->
          <nz-form-explain *ngIf="validateForm.get('team')?.dirty && validateForm.get('team')?.errors">
            请选择team
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook" >Modality</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="modality"
            (ngModelChange)="ModalityChanges($event)"
          >
            <nz-option
              *ngFor="let item of modalityOptions"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
          <nz-form-explain *ngIf="validateForm.get('modality')?.dirty && validateForm.get('modality')?.errors">
            请选择modality
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" [nzRequired]="!islook">BMC</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <nz-select
            nzSize="small"
            formControlName="bmc"
            (ngModelChange)="BMCChanges($event)"
          >
            <nz-option
              *ngFor="let item of bmcOptions"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
          <nz-form-explain *ngIf="validateForm.get('bmc')?.dirty && validateForm.get('bmc')?.errors">
            请选择bmc
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
    <div nz-row>
    <div nz-col nzSpan="12">
      <nz-form-item>
        <nz-form-label [nzSpan]="7">Cluster</nz-form-label>
        <nz-form-control [nzSpan]="17">
          <input nz-input formControlName="cluster">
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>
