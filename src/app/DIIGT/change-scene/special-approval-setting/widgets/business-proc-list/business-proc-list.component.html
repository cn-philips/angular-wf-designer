<form nz-form [formGroup]="formValues">
  <div nz-row>
    <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">审批流名称</nz-form-label>
        <nz-form-control [nzSm]="18" [nzXs]="24">
          <nz-select formControlName="processId" nzAllowClear nzPlaceHolder="请选择">
            <nz-option *ngFor="let item of selectOptions.processList" [nzValue]="item.value" [nzLabel]="item.label"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">状态</nz-form-label>
        <nz-form-control [nzSm]="18" [nzXs]="24">
          <nz-select formControlName="status" nzAllowClear nzPlaceHolder="请选择">
            <nz-option *ngFor="let item of selectOptions.statuses" [nzValue]="item.value" [nzLabel]="item.label"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">BG</nz-form-label>
        <nz-form-control [nzSm]="18" [nzXs]="24">
          <nz-select formControlName="bg" nzAllowClear nzPlaceHolder="请选择">
            <nz-option *ngFor="let item of selectOptions.bgList" [nzValue]="item.value" [nzLabel]="item.label"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">审批类型</nz-form-label>
        <nz-form-control [nzSm]="18" [nzXs]="24">
          <nz-select formControlName="applyType" nzAllowClear nzPlaceHolder="请选择">
            <nz-option *ngFor="let item of selectOptions.applyTypes" [nzValue]="item.value" [nzLabel]="item.label"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
      <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">申请原因</nz-form-label>
        <nz-form-control [nzSm]="18" [nzXs]="24">
          <nz-select formControlName="applyItem" nzAllowClear nzPlaceHolder="请选择">
            <nz-option *ngFor="let item of selectOptions.applyItems" [nzValue]="item.value" [nzLabel]="item.label"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
      <nz-form-item>
        <nz-form-control [nzOffset]="4">
          <button nz-button nzType="primary" (click)="getTableData()"><i nz-icon nzType="search"></i>搜索</button>
          <button nz-button nzType="primary" (click)="onReset()"><i nz-icon nzType="search"></i>重置</button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>

<div class="btn-container">
  <button nz-button nzType="primary" (click)="onShowAddForm()"><i nz-icon nzType="plus" nzTheme="outline"></i>新建</button>
  <button nz-button nzType="primary" [disabled]="selectedProc === null" (click)="onShowCloneForm()"><i nz-icon nzType="copy" nzTheme="outline"></i>克隆</button>
</div>

<nz-table [nzData]="tableData.list" [nzLoading]="tableData.loading" [nzShowPagination]="false">
  <thead>
    <tr>
      <th nzShowExpand></th>
      <th nzWidth="250px">审批类型</th>
      <th nzAlign="center" nzWidth="150px">BG</th>
      <th nzAlign="center" nzWidth="350px">申请原因</th>
      <th nzAlign="center">审批流名称</th>
      <th nzAlign="center" nzWidth="200px">启用/禁用</th>
      <th nzAlign="center" nzWidth="150px" nzRight="0px">操作</th>
    </tr>
  </thead>
  <tbody>
    <ng-template ngFor let-data [ngForOf]="tableData.list">
      <tr>
        <td nzShowExpand [(nzExpand)]="expandedRowMap[data.applyType]"></td>
        <td colspan="6">{{ data.applyTypeName }}({{ data.children.length }})</td>
      </tr>
      <tr style="cursor: pointer;" *ngFor="let item of data.children" [nzExpand]="expandedRowMap[data.applyType]" (click)="onSelectRow(item)">
        <td nzAlign="center"><label nz-radio [ngModel]="item.id === selectedProc?.id" (ngModelChange)="onSelectRow(item)" class="table-radio"></label></td>
        <td></td>
        <td nzAlign="center">{{ item.bg }}</td>
        <td nzAlign="center">{{ formatApplyItem(item) }}</td>
        <td nzAlign="center">{{ formatApproveProcName(item.processId) }}</td>
        <td nzAlign="center">
          <nz-switch [(ngModel)]="item.status" (click)="onToggleProcStatus(item)"></nz-switch>
        </td>
        <td nzAlign="center">
          <a nz-icon type="edit" title="编辑" (click)="onShowEditForm(item)"></a>
          <nz-divider nzType="vertical"></nz-divider>
          <a nz-icon type="delete" title="删除" nz-popconfirm nzTitle="确定删除流程?" (nzOnConfirm)="onDeleteProc(item)"></a>
        </td>
      </tr>
    </ng-template>
  </tbody>
</nz-table>

<sp-setting-business-proc-form (success)="getTableData(true)" #businessProcForm></sp-setting-business-proc-form>
