<nz-modal
  nzWidth="1000px"
  [nzStyle]="{ top: '20px' }"
  [(nzVisible)]="visible"
  [nzTitle]="modalTitle"
  [nzFooter]="modalFooter"
  (nzOnCancel)="onHideModal()"
  (nzOnOk)="onSubmit()"
>
  <form nz-form [formGroup]="formValues">
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24">启用/禁用</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-switch formControlName="status"></nz-switch>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzRequired [nzSm]="6" [nzXs]="24">BG</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select formControlName="bg" nzPlaceHolder="请选择">
              <nz-option
                *ngFor="let item of selectOptions.bgList"
                [nzLabel]="item.label"
                [nzValue]="item.value"
              ></nz-option>
            </nz-select>
            <nz-form-explain
              *ngIf="
                formValues.get('bg')?.dirty && formValues.get('bg')?.errors
              "
            >
              请选择BG
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzRequired [nzSm]="6" [nzXs]="24"
            >审批类型</nz-form-label
          >
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select
              formControlName="applyType"
              nzPlaceHolder="请选择"
              (ngModelChange)="onApplyTypeChange($event)"
              #applyType
            >
              <nz-option
                *ngFor="let item of selectOptions.applyTypes"
                [nzLabel]="item.label"
                [nzValue]="item.value"
              ></nz-option>
            </nz-select>
            <nz-form-explain
              *ngIf="
                formValues.get('applyType')?.dirty &&
                formValues.get('applyType')?.errors
              "
            >
              请选择审批类型
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzRequired [nzSm]="6" [nzXs]="24"
            >申请原因</nz-form-label
          >
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select formControlName="applyItem" nzPlaceHolder="请选择">
              <nz-option
                *ngIf="selectOptions.applyItems.length === 0"
                nzLabel="请先选择审批类型"
                nzDisabled
              ></nz-option>
              <nz-option
                *ngFor="let item of selectOptions.applyItems"
                [nzLabel]="item.label"
                [nzValue]="item.value"
              ></nz-option>
            </nz-select>
            <nz-form-explain
              *ngIf="
                formValues.get('applyItem')?.dirty &&
                formValues.get('applyItem')?.errors
              "
            >
              请选择申请原因
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row *ngIf="APPLY_TYPE.EXT_WARRANTY === applyType.value">
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24">区间</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-row nzGutter="4">
              <div nz-col nzSpan="5">
                <nz-select
                  style="width: 100%"
                  formControlName="minWarrantyMonthsComparator"
                  nzPlaceHolder="请选择"
                >
                  <nz-option nzLabel=">" nzValue=">"></nz-option>
                  <nz-option nzLabel=">=" nzValue=">="></nz-option>
                </nz-select>
              </div>
              <div nz-col nzSpan="4">
                <nz-input-number
                  style="width: 100%"
                  formControlName="minWarrantyMonths"
                  [nzMin]="0"
                  [nzStep]="1"
                ></nz-input-number>
              </div>
              <div nz-col nzSpan="6" style="text-align: center">
                申请延保月数
              </div>
              <div nz-col nzSpan="5">
                <nz-select
                  formControlName="maxWarrantyMonthsComparator"
                  nzPlaceHolder="请选择"
                >
                  <nz-option nzLabel="<" nzValue="<"></nz-option>
                  <nz-option nzLabel="<=" nzValue="<="></nz-option>
                </nz-select>
              </div>
              <div nz-col nzSpan="4">
                <nz-input-number
                  style="width: 100%"
                  formControlName="maxWarrantyMonths"
                  [nzMin]="1"
                  [nzStep]="1"
                ></nz-input-number>
              </div>
            </nz-row>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzRequired [nzSm]="6" [nzXs]="24"
            >审批流</nz-form-label
          >
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select
              style="width: 100%"
              formControlName="processId"
              nzPlaceHolder="请选择"
              (ngModelChange)="onProcessChange($event)"
              #processId
            >
              <nz-option
                *ngFor="let item of selectOptions.businessProcList"
                [nzLabel]="item.label"
                [nzValue]="item.value"
              ></nz-option>
            </nz-select>
            <nz-form-explain
              *ngIf="
                formValues.get('processId')?.dirty &&
                formValues.get('processId')?.errors
              "
            >
              请选择审批流
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row>
      <nz-spin [nzSpinning]="previewLoading">
        <div class="preview-container">
          <header>审批流预览</header>
          <div class="approve-diagram">
            <div
              *ngFor="let subList of businessProcNodeList"
              class="approve-row"
            >
              <div class="approve-col">
                <div
                  *ngFor="let item of subList.approverList"
                  class="approve-item"
                >
                  <div class="approve-avatar">
                    <i
                      nz-icon
                      nzType="user"
                      nzTheme="outline"
                      style="font-size: 36px"
                    ></i>
                    <div class="approver">{{ item.role || item.user }}</div>
                  </div>
                  <div class="vertical-line"></div>
                </div>
              </div>
              <div class="horizontal-line"></div>
            </div>
            <nz-empty
              nzNotFoundContent="请先选择审批流"
              *ngIf="businessProcNodeList.length === 0"
            ></nz-empty>
          </div>
        </div>
      </nz-spin>
    </div>
  </form>

  <ng-template #modalFooter>
    <button nz-button nzType="default" (click)="onHideModal()">取消</button>
    <button
      nz-button
      nzType="primary"
      (click)="onSubmit()"
      [nzLoading]="submitLoading"
    >
      确定
    </button>
  </ng-template>
</nz-modal>
