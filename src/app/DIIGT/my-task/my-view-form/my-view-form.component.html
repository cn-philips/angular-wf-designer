<form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm($event, validateForm.value)">
  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">销售</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="sale" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">医院</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="hospital" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">Reference No</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="referenceNo" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">本地名称(Market Bundle)</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="productName" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">项目名称</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="projectName" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">招标编号</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="biddingNo" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">投标公司</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="biddingCompany" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="16" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="4" [nzXs]="24">提交时间</nz-form-label>
        <nz-form-control [nzSm]="18" [nzXs]="24">
          <nz-range-picker
            nzFormat="yyyy-MM-dd"
            formControlName="subDate"
          ></nz-range-picker>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">业务模式</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="businessPattern"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of businessModelList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">进单模式</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="orderPattern"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of entryModeList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">进单状态</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="orderType"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of orderTypeList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
              [nzDisabled]="item.disabled"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">招标授权模式</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="applyType"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of biddingAuthorizationModeList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
              [nzDisabled]="item.disabled"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">招标授权状态</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="taskStatus"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of taskStatusList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
              [nzDisabled]="item.disabled"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzSpan="8" [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">是否授权</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="authorize"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of isAuthorizedList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
              [nzDisabled]="item.disabled"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>

    <div nz-col nzXs="24"
                nzSm="24"
                nzMd="8"
          [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">大区</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="bigRegion"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder="大区"
          >
            <nz-option
              *ngFor="let item of bigRegionList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
              [nzDisabled]="item.disabled"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzXs="24"
                nzSm="24"
                nzMd="8"
          [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">小区</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="smallRegion" placeholder="小区" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzXs="24"
                nzSm="24"
                nzMd="8"
          [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">经销商名称</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="agreementAgenName" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzXs="24"
                nzSm="24"
                nzMd="8"
          [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">BMC</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <nz-select
            formControlName="bmc"
            style="width: 100%;"
            nzShowSearch
            nzAllowClear
            nzPlaceHolder=""
          >
            <nz-option
              *ngFor="let item of bmcList"
              [nzValue]="item.code"
              [nzLabel]="item.label"
              [nzDisabled]="item.disabled"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col nzXs="24"
                nzSm="24"
                nzMd="8"
          [style.display]="isCollapse ? 'block' : 'none'">
      <nz-form-item>
        <nz-form-label [nzSm]="8" [nzXs]="24">SO#</nz-form-label>
        <nz-form-control [nzSm]="12" [nzXs]="24">
          <input nz-input formControlName="sap" placeholder="" />
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row nzType="flex" nzJustify="end" nzAlign="middle">
    <div nz-col nzSpan="16">
      <nz-form-item style="text-align: right;">
        <!--        <button nz-button [nzType]="'primary'" (click)="addNewItem('999')" style="margin-left: 10px;">向父元素传值999</button>-->
        <button nz-button [nzType]="'primary'" style="margin-left: 10px;">搜索</button>
        <button nz-button [nzType]="'primary'" style="margin-left: 10px;" (click)="resetForm()">清空</button>
        <button nz-button [nzType]="'primary'" (click)="exportExcel($event)" style="margin-left: 10px;">导出Excel</button>
        <button nz-button [nzType]="'primary'" (click)="projectReport($event)" style="margin-left: 10px;">Project Report</button>
        <a style="font-size:14px;margin-left: 10px;color: #1890ff;" (click)="toggleCollapse()">
          {{ isCollapse ? '收起' : '展开' }}
          <i nz-icon [type]="isCollapse ? 'up' : 'down'"></i>
        </a>
      </nz-form-item>
    </div>
  </div>
</form>
