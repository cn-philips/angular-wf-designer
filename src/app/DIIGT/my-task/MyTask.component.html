<nz-card class="title_warpper">
  <div>
    <h4 class="font-weight-bold"><span>My Tasks 我的任务</span>
    </h4>
  </div>
</nz-card>
<nz-tabset
  (nzSelectChange)="chooseTab($event)"
  [nzSelectedIndex]="tabIndex"
  [nzTabPosition]="'top'"
  [nzType]="'card'"
>
  <nz-tab nzTitle="To Do 我的待办">
    <nz-card>
      <igt-MyToDoTask></igt-MyToDoTask>
    </nz-card>
  </nz-tab>
  <nz-tab nzTitle="Done 我的已办">
    <nz-card>
      <igt-MyDoneTask></igt-MyDoneTask>
    </nz-card>
  </nz-tab>
</nz-tabset>
