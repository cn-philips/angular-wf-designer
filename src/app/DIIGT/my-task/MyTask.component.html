<h4 class="font-weight-bold py-3">
  <span>我的任务</span>
</h4>

<nz-card class="mtb1rem">

    [nzSelectedIndex]="tabIndex"
    [nzTabPosition]="'top'"
    [nzType]="'card'"

    </nz-tab>
  </nz-tabset>
