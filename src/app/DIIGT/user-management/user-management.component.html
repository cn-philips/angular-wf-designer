<div class="user-management-container">
  <nz-card class="title_warpper">
    <div>
      <h4 class="font-weight-bold">
        <span>用户管理</span>
      </h4>
    </div>
  </nz-card>
  <nz-card class="umc-wrap">
    <div nz-row nzType="flex" nzJustify="space-between">
      <div nz-col>
        <button (click)="handleCreate()" nz-button nzType="primary">
          <i nz-icon nzType="plus-circle" nzTheme="outline"></i>添加
        </button>
      </div>
      <div nz-col>
        <nz-input-group nzSearch [nzAddOnAfter]="suffixButton">
          <input
            type="text"
            [(ngModel)]="keyword"
            nz-input
            placeholder="Email"
          />
        </nz-input-group>
        <ng-template #suffixButton>
          <button nz-button nzType="primary" nzSearch>
            <i nz-icon nzType="search"></i>搜索
          </button>
        </ng-template>
      </div>
    </div>
    <div nz-row>
      <div nz-col>
        <nz-table
          [nzPageSize]="pageSize"
          [nzPageIndex]="currentPage"
          [nzData]="userTable"
          nzTableLayout="fixed"
          class="mtb1rem"
          nzSize="small"
          [nzScroll]="{ x: scrollX, y: '450px' }"
        >
          <thead>
            <tr>
              <th *ngFor="let column of tableHeader" [nzWidth]="column.width">
                {{ column.name }}
              </th>
              <th nzWidth="120px" nzRight="0px">Action 操作</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let data of userTable">
              <td>{{ data.id }}</td>
              <td>{{ data.name }}</td>
              <td>{{ data.email }}</td>
              <td>{{ data.lineManager }}</td>

              <td *ngIf="data.isRequestor" style="color: green">是</td>
              <td *ngIf="!data.isRequestor" style="color: red">否</td>

              <td *ngIf="data.isApprover" style="color: green">是</td>
              <td *ngIf="!data.isApprover" style="color: red">否</td>

              <td>{{ data.createdDate }}</td>
              <td>{{ data.createdBy }}</td>
              <td>{{ data.updatedDate }}</td>
              <td>{{ data.updatedBy }}</td>
              <td nzRight="0px">
                <button
                  nz-button
                  nzSize="small"
                  nzType="primary"
                  (click)="handleEdit(data.id)"
                >
                  编辑
                </button>
                <button
                  nz-button
                  nzSize="small"
                  nzType="primary"
                  (click)="handleDelete(data.id)"
                  *ngIf="!data.isApprover"
                >
                  删除
                </button>
              </td>
            </tr>
          </tbody>
        </nz-table>
      </div>
    </div>
  </nz-card>
</div>

<nz-drawer
  [nzClosable]="true"
  [nzVisible]="showDrawer"
  nzPlacement="left"
  [nzTitle]="drawerTitle"
  [nzMaskClosable]="false"
  [nzWidth]="fullDraw ? '100%' : '50%'"
  (nzOnClose)="handleClose()"
  class="user-management-draw"
>
  <div (click)="toggleDrawerSize()" class="draw-size-btn">
    <i
      nz-icon
      [nzType]="fullDraw ? 'fullscreen-exit' : 'fullscreen'"
      nzTheme="outline"
    ></i>
  </div>
  <app-user-management-form
    [type]="type"
    [id]="activeId"
    (onClose)="handleClose()"
  ></app-user-management-form>
</nz-drawer>
