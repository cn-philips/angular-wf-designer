<h4 class="font-weight-bold py-3 mb-4">
    <!--<span class="text-muted font-weight-light">Tables /</span>-->  My Profile  
</h4>
<div class="card mb-4">
    <!-- <h6 class="card-header">
      Overview
    </h6> -->
    <div class="card-body">
      <form *ngIf="user">
        <div class="form-group row">
          <label class="col-form-label col-sm-2 text-sm-right">Code</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" disabled value="{{user.code}}">
          </div>
        </div>
        <div class="form-group row">
          <label class="col-form-label col-sm-2 text-sm-right">姓名</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" disabled value="{{user.name}}">
          </div>
        </div>
        <div class="form-group row">
          <label class="col-form-label col-sm-2 text-sm-right">Email</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" disabled value="{{user.email}}">
          </div>
        </div>
        <div class="form-group row">
          <label class="col-form-label col-sm-2 text-sm-right">Mobile</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" disabled value="{{user.phone}}">
          </div>
        </div>
        <div class="form-group row">
          <label class="col-form-label col-sm-2 text-sm-right">Description</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" disabled value="{{user.description}}">
          </div>
        </div>
      </form>
    </div>
</div>
