<sidenav [orientation]="orientation" [ngClass]="getClasses()">
  <!-- Inner -->
  <div
    class="sidenav-inner"
    [ngClass]="{ 'py-1': orientation !== 'horizontal' }"
  >
    <ng-template #nav let-list>
      <ng-container *ngFor="let item of list">
        <ng-container *ngIf="item.flag && item.children.length > 0">
          <sidenav-menu
            icon="{{ item.icon }}"
            text="{{ this.lang === 'zh-CN'?item.jurisdictionName:item.jurisdictionEnName }}"
            [active]="isParentActive(item)"
            [open]="isParentActive(item)||item.jurisdictionEnName.indexOf('Workspace')>=0||item.jurisdictionEnName.indexOf('My Supplement')>=0"
          >
            <ng-container
              *ngTemplateOutlet="nav; context: { $implicit: item.children }"
            ></ng-container>
          </sidenav-menu>
        </ng-container>
        <ng-container *ngIf="item.flag == false">
          <sidenav-router-link
            icon="{{ item.icon }}"
            *ngIf="item.status == 0"
            route="{{ item.route }}"
            [skipLocationChange]="false"
            [active]="isActiveLeaf(item.route)"
            [id]="'nav_'+item.jurisdictionCode"
          >
            {{ this.lang === 'zh-CN'?item.jurisdictionName:item.jurisdictionEnName }}&nbsp;
            <div
              class="badge badge-primary"
              *ngIf="
                item.jurisdictionEnName == 'My Todo' &&
                taskCountService.myPending != 0
              "
            >
              {{ taskCountService.myPending }}
            </div>
            <div
              class="badge badge-primary"
              *ngIf="
                item.jurisdictionEnName == 'My Done' &&
                taskCountService.myDone != 0
              "
            >
              {{ taskCountService.myDone }}
            </div>
            <div
              class="badge badge-primary"
              *ngIf="
                item.jurisdictionEnName == 'My Draft' &&
                taskCountService.myDraft != 0
              "
            >
              {{ taskCountService.myDraft }}
            </div>
            <div
              class="badge badge-primary"
              *ngIf="
                item.jurisdictionEnName == 'My Started' &&
                taskCountService.myApply != 0
              "
            >
              {{ taskCountService.myApply }}
            </div>
            <!-- <div
              class="badge badge-primary"
              *ngIf="
                item.jurisdictionEnName == 'My View' &&
                taskCountService.myView != 0
              "
            >
              {{ taskCountService.myView }}
            </div> -->
          </sidenav-router-link>
        </ng-container>
      </ng-container>
    </ng-template>
    <ng-container
      *ngTemplateOutlet="nav; context: { $implicit: list }"
    ></ng-container>
  </div>
</sidenav>
