<div
  class="layout-wrapper layout-basic"
  [ngClass]="{
    'layout-loading': !initialized,
    'is-mobile': layoutService.isMobileDevice()
  }"
>
  <div class="layout-inner">
    <app-layout-navbar></app-layout-navbar>

    <div class="layout-container">
      <app-layout-sidenav></app-layout-sidenav>

      <div class="layout-content">
        <app-breadcrumb></app-breadcrumb>
        <div
          class="container-fluid router-transitions flex-grow-1 container-p-y"
        >
          <router-outlet></router-outlet>
        </div>

        <!-- <app-layout-footer></app-layout-footer> -->
      </div>
    </div>
  </div>
</div>
<div class="layout-overlay" (click)="closeSidenav()"></div>
