<div class="row" *ngIf="!isCompleted">
  <div class="form-group col-sm-6 col-md-6">
    <label class="ng-star-inserted">
      <div class="form-check-inline">
      <input type="checkbox" class="form-check-input" [ngModel]="selectOrderType.orderType == '1'" #specialCkb (change)="changeCkb(specialCkb);">
      <span class="ng-star-inserted form-check-label">特价进单</span>
      <input type="hidden" [(ngModel)]="selectOrderType.orderType">
      <input type="hidden" [(ngModel)]="selectOrderType.isCompleted">
      </div>
    </label>
    <ng-select [items]="specialOrderSelects"
      bindLabel="labelNew" 
      bindValue="label"
      [(ngModel)]="selectOrderType.specialOrderDispalyName"
      (change)="changeSpecialOrderSelect($event);"
      [disabled]="selectOrderType.orderType !== '1'"
      >
    </ng-select>
  </div>
  <!-- <pre>{{selectOrderType | json}}</pre> -->
  <!-- <pre>{{formState | json}}</pre> -->
</div>
<div class="row" *ngIf="!isCompleted">
  <div class="form-group col-md-2 ml-auto mt-auto" style="text-align:right;">
    <button class="btn btn-primary" (click)="orderNext()">下一步</button>
  </div>
</div>
<div class="row" *ngIf="isCompleted">
  <div class="form-group col-sm-6 col-md-6" *ngIf="selectOrderType.orderType == '1'">
    <label class="ng-star-inserted">
      <div class="form-check-inline">
        <input type="checkbox" class="form-check-input" checked disabled>
        <span class="ng-star-inserted">特价进单&ensp;&ensp;</span>
        <input type="checkbox" class="form-check-input" disabled>
        <span class="ng-star-inserted form-check-label">非特价进单</span>
      </div>
    </label>
    <input class="form-control" [value]="selectOrderType.specialOrderDispalyName" disabled >
  </div>
  <div class="form-group col-sm-6 col-md-6" *ngIf="selectOrderType.orderType == '0'">
    <label class="ng-star-inserted">
      <div class="form-check-inline">
        <input type="checkbox" class="form-check-input" disabled>
        <span class="ng-star-inserted form-check-label">特价进单&ensp;&ensp;</span>
        <input type="checkbox" class="form-check-input" checked disabled>
        <span class="ng-star-inserted">非特价进单</span>
      </div>
    </label>
  </div>
</div>
