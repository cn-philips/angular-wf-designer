<h4 class="font-weight-bold py-3 mb-4">
  <!--<span class="text-muted font-weight-light">Tables /</span>-->  我发起的
</h4>

<hr class="border-light container-m--x mt-0 mb-4">

<div class="demo-vertical-spacing">
  <div>
    <form #searchForm="ngForm">
      <div class="row">
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">审批编号</label>
          <input ngModel class="form-control" type="text" name="businessNumber">
        </div>
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">最终用户名称</label>
          <input ngModel class="form-control" type="text" name="businessName">
        </div>
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">审批类型</label>
          <select ngModel class="form-control custom-select" name="processName">
            <option value="" selected>&ensp;</option>
            <option *ngFor="let item of processList" [value]="item.name">{{item.name}}</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">开始日期起</label>
          <div class="input-group">
            <input ngModel class="form-control" name="createTimeStart"
                   ngbDatepicker
                   navigation="'select'"
                   #d1="ngbDatepicker">
            <div class="input-group-append">
              <button class="input-group-text" (click)="d1.toggle()" type="button">
                <span class="ion ion-md-calendar" style="cursor: pointer;"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">开始日期止</label>
          <div class="input-group">
            <input ngModel class="form-control" name="createTimeEnd"
                   ngbDatepicker
                   navigation="'select'"
                   #d2="ngbDatepicker">
            <div class="input-group-append">
              <button class="input-group-text" (click)="d2.toggle()" type="button">
                <span class="ion ion-md-calendar" style="cursor: pointer;"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">SOFON Number</label>
          <input ngModel class="form-control" type="text" name="sofonNumber">
        </div>
      </div>
      <div class="row">
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">完成日期起</label>
          <div class="input-group">
            <input ngModel
                   class="form-control" name="finishedTimeStart"
                   ngbDatepicker
                   navigation="'select'"
                   #d3="ngbDatepicker">
            <div class="input-group-append">
              <button class="input-group-text" (click)="d3.toggle()" type="button">
                <span class="ion ion-md-calendar" style="cursor: pointer;"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3">
          <label class="form-label">完成日期止</label>
          <div class="input-group">
            <input
              ngModel
              class="form-control" name="finishedTimeEnd"
              ngbDatepicker
              navigation="'select'"
              #d4="ngbDatepicker">
            <div class="input-group-append">
              <button class="input-group-text" (click)="d4.toggle()" type="button">
                <span class="ion ion-md-calendar" style="cursor: pointer;"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-5 col-lg-3 mb-3 ml-auto mt-auto">
          <button type="button" class="btn btn-primary" (click)="applyFilter();">查询</button>
          <button type="button" class="btn btn-info" (click)="resetForm();">重置</button>
        </div>
      </div>
    </form>

    <div class="table-responsive">
      <ngx-datatable #table style="min-width: 500px"
                     [rows]="rows"
                     [loadingIndicator]="loadingIndicator"
                     [columnMode]="'force'"
                     [headerHeight]="43"
                     [footerHeight]="'auto'"
                     [rowHeight]="'auto'"
                     [reorderable]="true"
                     [selected]="selected"
                     [selectionType]="'checkbox'"
                     [externalPaging]="true"
                     [externalSorting]="true"
                     [count]="page.totalElements"
                     [offset]="page.pageNumber"
                     [limit]="page.pageSize"
                     [sortType]="'single'"
                     (page)="pageCallback($event)"
                     (sort)="sortCallback($event)">
        <ngx-datatable-column prop="businessNumber" name="申请编号" [headerClass]="getHeaderClass"
                              [cellClass]="getCellClass"></ngx-datatable-column>
        <ngx-datatable-column prop="name" name="审批名称" [sortable]="false" [headerClass]="getHeaderClass"
                              [cellClass]="getCellClass"></ngx-datatable-column>
        <ngx-datatable-column prop="businessName" name="业务名称" [sortable]="false" [headerClass]="getHeaderClass"
                              [cellClass]="getCellClass"></ngx-datatable-column>
        <ngx-datatable-column prop="startDateTime" name="开始日期" [headerClass]="getHeaderClass"
                              [cellClass]="getCellClass">
          <ng-template let-value="value" ngx-datatable-cell-template>
            {{value | date:'yyyy-MM-dd HH:mm:ss'}}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="finishedDateTime" name="完成日期" [headerClass]="getHeaderClass"
                              [cellClass]="getCellClass">
          <ng-template let-value="value" ngx-datatable-cell-template>
            {{value | date:'yyyy-MM-dd HH:mm:ss'}}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column prop="sofonNumber" name="SOFON号" [sortable]="false" [headerClass]="getHeaderClass"
          [cellClass]="getCellClass"></ngx-datatable-column>
        <ngx-datatable-column prop="state" name="状态" [sortable]="false" [headerClass]="getHeaderClass"
                              [cellClass]="getCellClass">
          <ng-template let-value="value" ngx-datatable-cell-template>
            {{value | myApprovalState}}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="操作" [sortable]="false" [headerClass]="getHeaderClass" [cellClass]="getCellClass">
          <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
            <!--<a *ngIf="row.state=='running'" href="javascript:void(0)" class="btn btn-info btn-xs" (click)=openSimpleModal(row)>查看</a>-->
            <a href="javascript:void(0)" class="btn btn-info btn-xs" (click)=openProcessDetailModal(row)>查看</a>
            <a *ngIf="row.cancel" href="javascript:void(0)" class="btn btn-danger btn-xs"
               mwlConfirmationPopover
               popoverMessage="确认取消流程？"
               placement="top"
               confirmText="确认" [popoverTitle]="''"
               cancelText="取消"
               (confirm)="cancelProcess(row);">撤销</a>
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</div>
