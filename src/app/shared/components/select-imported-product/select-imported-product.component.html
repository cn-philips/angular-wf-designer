<nz-modal [(nzVisible)]="visible" nzWidth="1000px" [nzTitle]="'选择产品'" [nzFooter]="null" (nzOnCancel)="onHide()">
  <div nz-row [nzGutter]="24">
    <div nz-col [nzSpan]="8">
      <nz-form-item>
        <nz-form-label [nzSpan]="6" nzFor="email">产品型号
        </nz-form-label>
        <nz-form-control [nzSpan]="18">
          <input nz-input [(ngModel)]="searchParams.model" placeholder="请输入产品型号名称">
        </nz-form-control>
      </nz-form-item>
    </div>
    <div nz-col [nzSpan]="8">
      <nz-form-item>
        <nz-form-label [nzSpan]="6" nzFor="email">BMC
        </nz-form-label>
        <nz-form-control [nzSpan]="18">
          <input nz-input [(ngModel)]="searchParams.bmc" placeholder="请输入BMC">
        </nz-form-control>
      </nz-form-item>
    </div>

    <div nz-col [nzSpan]="8" style="text-align: right;">
      <nz-form-item>
        <nz-form-control>
          <button nz-button class="ml10" nzType="primary" (click)="getTableData(true)" [nzSize]="6">
            {{"components.select-hospital.search" | translate}}
          </button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div class="table-container">
    <nz-table [nzData]="tableData.rows" [nzShowTotal]="totalTemplate" [nzTotal]="tableData.total"
      [nzLoading]="tableData.loading" [nzPageSizeOptions]="[5, 10, 20, 30, 40, 50 ]" [nzShowQuickJumper]="true"
      [nzShowSizeChanger]="true" [nzFrontPagination]="false" [nzScroll]="{ y: '300px' }"
      [(nzPageIndex)]="searchParams.pageNo" [(nzPageSize)]="searchParams.pageSize" (nzPageIndexChange)="getTableData()"
      (nzPageSizeChange)="getTableData()">
      <thead>
        <tr>
          <th nzWidth="300px" nzAlign="left">进单产品型号</th>
          <th nzWidth="300px" nzAlign="left">Modality</th>
          <th nzAlign="left">BMC</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of tableData.rows">
          <td nzAlign="left">{{ item.name }}</td>
          <td nzAlign="left">{{ item.modality }}</td>
          <td nzAlign="left">{{ item.bmc }}</td>
          <td nzAlign="right">
            <button nz-button nzSize="small" nzType="primary"
              (click)="onSelect(item)">{{"components.select-hospital.select" | translate}}</button>
          </td>
        </tr>
      </tbody>
    </nz-table>

    <ng-template #totalTemplate let-total>
      {{"components.select-hospital.total" | translate: { total : tableData.total } }} </ng-template>
  </div>
</nz-modal>
