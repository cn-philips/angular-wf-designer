<nz-card class="title_warpper">
  <div>
    <h4 class="font-weight-bold">
      <span>Authorization Grant 授权发放</span>
    </h4>
  </div>
</nz-card>
<igt-approval-flowline></igt-approval-flowline>
<div class="demo-vertical-spacing">
  <div class="posi tabs-box">
    <div
      nz-row
      nzType="flex"
      nzJustify="end"
      nzAlign="middle"
      class="tabs-box-actions"
    >
      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right">
            <button
              nz-button
              nzType="default"
              (click)="toReturn()"
              style="margin-right: 10px"
            >
              Return 返回
            </button>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <ngb-tabset type="tabs" [destroyOnHide]="true"  class="nav-tabs-top nav-responsive-xl">
      <!--基础信息-->
      <ngb-tab id="pending-tab">
        <ng-template ngbTabTitle><span class="tab-title"><strong>Bidding Application<br> 投标申请表</strong>&ensp;</span></ng-template>
        <ng-template ngbTabContent>
          <div class="card-body">
            <!--            <app-my-ppending (pendingTaskEvent)="onPendingTaskEvent($event)"></app-my-ppending>-->
            <!-- <app-emp-in></app-emp-in> -->
            <!--            <my-task-pending (pendingTaskEvent)="onPendingTaskEvent($event)"></my-task-pending>-->
             <!--基础信息-->
             <app-applybase [isDisable]="true" [dataBase]="data"></app-applybase>
             <!--产品信息-->
             <app-newproduct [isDisable]="true" [dataBase]="data"></app-newproduct>
             <!--补充信息-->
             <app-supplement [isDisable]="true" [dataBase]="data"></app-supplement>
          </div>
        </ng-template>
      </ngb-tab>
      <!--授权发放-->
      <ngb-tab id="complete-duc4">
        <ng-template ngbTabTitle><span class="tab-title"><strong>Authorization Grant<br> 授权发放</strong></span></ng-template>
        <ng-template ngbTabContent>
          <div class="card-body">
            <app-emp-emp [data]="data" [param]="param" [fileList]="fileList"></app-emp-emp>
          </div>
        </ng-template>
      </ngb-tab>
    </ngb-tabset>
  </div>
</div>
