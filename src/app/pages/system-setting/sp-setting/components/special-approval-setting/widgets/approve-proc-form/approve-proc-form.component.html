<nz-modal
  nzWidth="80%"
  [(nzVisible)]="visible"
  [nzTitle]="modalTitle"
  [nzFooter]="modalFooter"
  [nzStyle]="{ top: '20px' }"
  (nzOnCancel)="onHideModal()"
  (nzOnOk)="onSubmit()"
>
  <form nz-form [formGroup]="formValues">
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24">启用/禁用</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-switch formControlName="status"></nz-switch>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24">审批编号</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <input formControlName="code" nz-input placeholder="自动生成" disabled />
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzFor="name"  nzRequired [nzSm]="6" [nzXs]="24">审批流名称</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <input formControlName="name" id="name" nz-input />
            <nz-form-explain *ngIf="formValues.get('name')?.dirty &&formValues.get('name')?.errors">
              请输入审批流名称
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div nz-row>
      <div nz-col [nzMd]="16" [nzSm]="16" [nzXs]="24">
        <nz-form-item>
          <nz-form-label nzFor="remark" [nzSm]="6" [nzXs]="24">说明</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <textarea rows="4" nz-input formControlName="remark" id="remark"></textarea>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </form>

  <div nz-row>
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-label [nzSm]="4" [nzXs]="24">审批流设置</nz-form-label>
        <nz-form-control [nzSm]="20" [nzXs]="24">
          <nz-table [nzData]="nodeList.list" [nzLoading]="nodeList.loading" [nzShowPagination]="false">
            <thead>
              <tr>
                <th nzAlign="center" nzWidth="100px">启用/禁用</th>
                <th nzAlign="center" nzWidth="100px">动作</th>
                <th nzAlign="center" nzWidth="120px">模式</th>
                <th nzAlign="center">节点显示名称</th>
                <th nzAlign="center">审批人</th>
                <th nzAlign="center" nzWidth="100px" nzRight="0px">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let node of nodeList.list;let i = index;">
                <td nzAlign="center">
                  <nz-switch [nzDisabled]="i === 0" [(ngModel)]="node.status"></nz-switch>
                </td>
                <td nzAlign="center">{{ APPROVE_NODE_ACTION_MAP[node.action] || '未设置' }}</td>
                <td nzAlign="center">{{ formatNodeMode(node) }}</td>
                <td nzAlign="center">{{ node.name || '未设置' }}</td>
                <td nzAlign="center">{{ formatNodeApprover(node) }}</td>
                <td nzAlign="center" nzRight="0px">
                  <a nz-icon type="edit" title="编辑" (click)="onShowNodeEditForm(node)"></a>
                </td>
              </tr>
            </tbody>
          </nz-table>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <ng-template #modalFooter>
    <button nz-button nzType="default" (click)="onHideModal()">取消</button>
    <button
      nz-button
      nzType="primary"
      (click)="onSubmit()"
      [nzLoading]="submitLoading"
    >
      确定
    </button>
  </ng-template>

  <sp-setting-approve-node-form (success)="onSubmitNodeForm($event)" #approveNodeForm></sp-setting-approve-node-form>
</nz-modal>
