<nz-modal
  [nzVisible]="visible"
  nzWidth="600px"
  nzTitle="任务转派"
  (nzOnCancel)="handleCloseModel()"
  [nzFooter]="dialogFooter"
>
  <form nz-form [formGroup]="formValues">
    <nz-form-item>
      <nz-form-label nzSpan="6"> 角色 </nz-form-label>
      <nz-form-control nzSpan="18">
        <nz-select
          nzShowSearch
          nzAllowClear
          formControlName="role"
          (ngModelChange)="handleRoleChange()"
        >
          <nz-option
            *ngFor="let item of selectOptions.role"
            [nzLabel]="item.label"
            [nzValue]="item.value"
          ></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzSpan="6" nzRequired> 接收人 </nz-form-label>
      <nz-form-control nzSpan="18">
        <nz-select
          formControlName="receiver"
          nzShowSearch
          nzAllowClear
          [nzServerSearch]="true"
          (nzOnSearch)="handleSearchUser($event)"
        >
          <ng-container *ngFor="let item of selectOptions.receiver">
            <nz-option
              *ngIf="!searchLoading"
              [nzValue]="item.value"
              [nzLabel]="item.label"
            ></nz-option>
          </ng-container>
          <nz-option *ngIf="searchLoading" nzDisabled nzCustomContent>
            <i nz-icon type="loading" class="loading-icon"></i> 查询中....
          </nz-option>
        </nz-select>
        <nz-form-explain
          *ngIf="
            formValues.get('receiver')?.dirty &&
            formValues.get('receiver')?.errors
          "
        >
          请选择接收人
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item *ngIf="isOit">
      <nz-form-label nzSpan="6"> 始终持续 </nz-form-label>
      <nz-form-control nzSpan="18">
        <label nz-checkbox formControlName="continue" #continue></label>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item *ngIf="!isOit">
      <nz-form-label nzSpan="6" nzRequired> 备注 </nz-form-label>
      <nz-form-control nzSpan="18">
        <textarea
          rows="4"
          nz-input
          formControlName="transferReason"
          id="transferReason"
          oninput="if(value.length>1000)value=value.slice(0,1000)"
          placeholder="说明转派原因"
        ></textarea>
        <div>
          还可以输入:{{
            formValues.get("transferReason").value
              ? formValues.get("transferReason").value.length
              : 0
          }}/{{ 1000 }}
        </div>
        <nz-form-explain
          *ngIf="
            formValues.get('transferReason')?.dirty &&
            formValues.get('transferReason')?.errors
          "
        >
          请填写备注
        </nz-form-explain>
      </nz-form-control>
    </nz-form-item>
  </form>

  <ng-template #dialogFooter>
    <button nz-button nzType="default" (click)="handleCloseModel()">
      取消
    </button>
    <button
      nz-button
      nzType="primary"
      (click)="handleSubmit()"
      [nzLoading]="submitLoading"
    >
      确定
    </button>
  </ng-template>
</nz-modal>
