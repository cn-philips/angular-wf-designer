<div class="region-management-container">
  <nz-card class="title_warpper">
    <div nzType="flex" nz-row nzAlign="middle" nzJustify="space-between">
      <div nz-col>
        <h4 class="font-weight-bold">
          <span>Users 区域管理</span>
        </h4>
      </div>

      <div nz-col>
        <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
          <input type="text" nz-input [(ngModel)]="email" placeholder="输入用户邮箱" />
        </nz-input-group>
        <ng-template #suffixIconButton>
          <button nz-button nzType="primary" nzSearch (click)="searchUser()"><i nz-icon type="search"></i></button>
        </ng-template>
      </div>
    </div>

  </nz-card>
  <nz-card class="rmc-wrap">
    <div nz-row [nzGutter]="16" class="rmc-content">
      <div nz-col nzSpan="6" style="height: 100%">
        <nz-card class="side-tree">
          <app-region-management-tree #treeComponent [regionNode]="activeNode" (onChange)="handleTreeChange($event)">
          </app-region-management-tree>
        </nz-card>
      </div>
      <div nz-col nzSpan="18">
        <div nz-row>
          <div nz-col="24">
            <app-region-management-filter [treeComponent]="treeComponent" [regionNode]="this.activeNode"
              [userTableComponent]="userTableComponent"></app-region-management-filter>
          </div>
          <div nz-col="24" class="mtb1rem regionTable">
            <nz-card>
              <app-region-user-table #userTableComponent [treeComponent]="treeComponent" [regionNode]="this.activeNode">
              </app-region-user-table>
            </nz-card>
          </div>
        </div>
      </div>
    </div>
  </nz-card>
</div>


<!-- Drawer -->
<nz-drawer [nzClosable]="true" [nzVisible]="ifShowDrawer" nzPlacement="right" [nzMaskClosable]="true" [nzTitle]="title"
  [nzWidth]="'50%'" (nzOnClose)="handleCancel()" class="role-management-draw">

  <!-- End Role-Modality-BMC  -->
  <!-- User Basic Inform -->
  <div nz-row nzType="flex" nzJustify="space-between">
    <div nz-col>
      <h5>General Information 基础信息</h5>
    </div>
  </div>
  <div nz-row>
    <div nz-col>
      <app-user-basic-info-form #basicInfoFormComponent [islook]="islook" [readonly]="readonly" [(user)]="userInform"
        [formType]="userFormType"></app-user-basic-info-form>
    </div>
  </div>

  <!-- Role-Modality-BMC  -->
  <div nz-row nzType="flex" nzJustify="space-between">

    <div nz-col *ngIf="islook">
      <h5>Business-Info-Area</h5>
    </div>
  </div>
  <div nz-row>
    <div nz-col>
      <br *ngIf="islook">
      <app-business-info-area style="margin-top: 10px" #areaComponent *ngIf="islook" [dataSource]="businessinfo"
        [email]="email" [readonly]="true"></app-business-info-area>
    </div>
  </div>

  <!-- End User Basic Inform -->
  <div style="float: right">
    <button nz-button nzType="default" (click)="handleCancel()">Close 关闭</button>
  </div>
</nz-drawer>
<!-- End Drawer -->
