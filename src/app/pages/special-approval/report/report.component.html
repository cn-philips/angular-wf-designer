<nz-card [nzBodyStyle]="{ padding: '12px' }">
  <form nz-form [formGroup]="formValues">
    <div
      nz-row
      nzType="flex"
      nzJustify="start"
      nzAlign="middle"
      style="
        background-color: #f6f7f9;
        color: #ffffff;
        line-height: 22px;
        margin-top: 16px;
        padding-top: 24px;
      "
    >
      <div nz-col [nzMd]="6" [nzSm]="12" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="applyStatusIn" nzRequired
            >申请状态</nz-form-label
          >
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select
              id="applyStatusIn"
              formControlName="applyStatusIn"
              nzAllowClear
              nzPlaceHolder="请选择"
              nzMode="multiple"
            >
              <nz-option
                *ngFor="let status of selectOptions.statuses"
                [nzValue]="status.value"
                [nzLabel]="status.label"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzMd]="6" [nzSm]="12" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="bgIn" nzRequired
            >BG</nz-form-label
          >
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select
              id="bgIn"
              formControlName="bgIn"
              nzAllowClear
              nzPlaceHolder="请选择"
              (ngModelChange)="refuseBgChang($event)"
              nzMode="multiple"
            >
              <nz-option
                *ngFor="let bg of selectOptions.bgs"
                [nzValue]="bg"
                [nzLabel]="bg == 'PD&IGT' ? 'PD&IGT(excel.US)' : bg"
              ></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzMd]="6" [nzSm]="12" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="submitDate"
            >提交时间</nz-form-label
          >
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-range-picker
              nzFormat="yyyy年MM月dd日"
              style="width: 100%"
              id="submitDate"
              formControlName="submitDate"
            ></nz-range-picker>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
    <div *ngFor="let row of reportList">
      <div class="mb-2" style="font-weight: 600">{{ row.label }}</div>
      <div nz-row [nzGutter]="16">
        <div *ngFor="let card of row.items">
          <div nz-col nzSpan="6" *ngIf="userPermission.includes(card.type)">
            <nz-card
              nz-row
              nzFlex
              [nzBodyStyle]="{ padding: 0 }"
              style="
                border: none;
                background-color: rgb(223, 223, 223);
                margin: 10px;
              "
              nzHoverable
              (click)="onExport(card.type, card.value)"
            >
              <div class="export-content bg-gray">
                <div class="export-img-wrap" nz-col>
                  <i
                    nz-icon
                    nzType="file-excel"
                    nzTheme="twotone"
                    style="font-size: 50px"
                  ></i>
                </div>
                <span>{{ card.value }}</span>
              </div>
            </nz-card>
          </div>
          <div nz-col nzSpan="6" *ngIf="!userPermission.includes(card.type)">
            <nz-card
              nz-row
              nzFlex
              [nzBodyStyle]="{ padding: 0 }"
              style="border: none; background-color: rgba(0%); margin: 10px"
            >
              <div class="export-content bg-gray">
                <div class="export-img-wrap" nz-col>
                  <i
                    nz-icon
                    nzType="file-excel"
                    nzTheme="twotone"
                    nzTwotoneColor="#808080"
                    style="font-size: 50px"
                  ></i>
                </div>
                <span>{{ card.value }}</span>
              </div>
            </nz-card>
          </div>
        </div>
      </div>
    </div>
  </form>
</nz-card>
