<app-apploading [load]="pageLoading"></app-apploading>
<nz-card class="title_warpper mtb1rem">
  <app-approval-progress></app-approval-progress>
</nz-card>
<div class="tabs-box">
    <app-tabs #tabs (select)="tabclick($event)">
      <app-tab [title]="'orderv3.pages.ordersummary.contract-summary' | translate" id="contract-tab">
        <div class="card-body">
          <pre-base-info-from
            #baseInfoFromChild
            [formValue]="formValue"
            [editPreTable]="false"
            [editable]="false"
            [isContract]="true"
            [subTierSubject]="subTierSubject"
          >
          </pre-base-info-from>
          <pre-base-info-table [formValue]="formValue" [isContract]="true"></pre-base-info-table>
        </div>
      </app-tab>
      <app-tab title="Order Summary" id="pending-tab">
        <div class="card-body">
          <ecos-ordersummary-info
            [formValue]="formValue"
            [bg]="baseInfoFromData.getRawValue().orderModality"
            [editable]="false"
            [editPreTable]="false"
          ></ecos-ordersummary-info>
          <pre-base-info-table
            #preFileTable
            [formValue]="formValue"
            [editable]="false"
            [isContract]="true"
            [isResultVerify]="true"
          ></pre-base-info-table>
          <app-oa-add-info
            #oaAddInfoChild
            [formValue]="formValue"
          ></app-oa-add-info>
        </div>
      </app-tab>
      <app-tab [title]="'orderv3.pages.ordersummary.history' | translate" id="complete-tab">
        <div class="card-body">
          <app-form-section [title]="'orderv3.pages.contract-examine.history'| translate">
            <approval-history-oit [applyId]="applyId">
            </approval-history-oit>
            <app-form-section class="mtb1rem" [title]="'orderv3.pages.pre-order.history-child' | translate">
              <shared-approval-history
                [procInstId]="procInstId"></shared-approval-history>
            </app-form-section>
          </app-form-section>
          <contract-remarks [formValue]="formValue" [remarkFrom]="remarkFromData"></contract-remarks>
        </div>
      </app-tab>
      <app-tab [title]="'orderv3.pages.ordersummary.change' | translate" *ngIf="changeItem" id="approve-change">
        <div class="card-body">
          <approve-change [formValue]="formValue"></approve-change>
        </div>
      </app-tab>
    </app-tabs>
    <div *ngIf="formValue.getRawValue().processStatus === 'ecos_oit_order_os_input' && flag === '0'">
      <div class="fixed-btn-group" nz-row nzType="flex" nzJustify="center" nzAlign="middle">
        <div nz-col nzSpan="24">
          <nz-form-item>
            <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: center">
              <button [disabled]="tabIndex==0" nz-button nzType="default" style="margin-right: 10px" (click)="goPreStep()">
                {{"orderv3.pages.ordersummary.pre-step" | translate}}
              </button>
              <button [disabled]="tabIndex==(tabList.length-1)" nz-button nzType="default" style="margin-right: 10px" (click)="goNextStep()">
                {{"orderv3.pages.ordersummary.next-step" | translate}}
              </button>
              <button nz-button nzType="default" style="margin-right: 10px" (click)="handleCancel()">
                {{"orderv3.pages.ordersummary.cancel" | translate}}
              </button>
              <button nz-button nzType="default" (click)="orderSubmit('apply_save')" style="margin-right: 10px">
                {{"orderv3.pages.ordersummary.save" | translate}}
              </button>
              <button nz-button nzType="primary" nz-popconfirm nzTitle="你确定要执行提交的操作?"
                (nzOnConfirm)="orderSubmit('approved')">
                {{"orderv3.pages.ordersummary.submit-order" | translate}}
              </button> <button nz-button nzType="primary" [disabled]="isRaisedFlow" nz-popconfirm nzTitle="你确定要执行退回到合同概要表的操作?"
                (nzOnConfirm)="orderSubmit('rejected')">
                {{"orderv3.pages.ordersummary.reject" | translate}}
              </button>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </div>
    <div *ngIf="flag === '0' && (formValue.getRawValue().processStatus === 'ecos_oit_order_os_finance'
      || formValue.getRawValue().processStatus === 'ecos_oit_order_os_finance_bp'
      || formValue.getRawValue().processStatus === 'ecos_oit_order_os_pm')" class="fixed-btn-group" nz-row
      nzType="flex" nzJustify="center" nzAlign="middle">
      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: center">
            <button nz-button nzType="default" style="margin-right: 10px">
              {{"orderv3.pages.ordersummary.cancel" | translate}}
            </button>
            <button nz-button nzType="primary" nz-popconfirm nzTitle="你确定要执行批准的操作?"
              (nzOnConfirm)="orderSubmit('approved')">
              {{"orderv3.pages.ordersummary.approved" | translate}}
            </button>
            <button nz-button nzType="primary" nz-popconfirm nzTitle="你确定要执行拒绝的操作?"
              (nzOnConfirm)="orderSubmit('rejected', true)">
              {{"orderv3.pages.ordersummary.refuse" | translate}}
            </button>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
</div>
