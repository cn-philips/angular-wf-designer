<app-apploading [load]="pageLoading"></app-apploading>
<nz-card class="title_warpper mtb1rem">
  <app-approval-progress></app-approval-progress>
</nz-card>
<div class="tabs-box">

  <app-tabs
    (select)="tabclick($event)"
    #tabs>
    <app-tab [title]="'orderv3.pages.contract-examine.contract-summary'|translate" id="pending-tab">
      <div class="card-body">
        <pre-base-info-from
          #baseInfoFromChild
          [formValue]="formValue"
          [editPreTable]="editPreTable"
          [editable]="editBase"
          [isContract]="isContract">
        </pre-base-info-from>
        <pre-base-info-table
          #baseInfoTableChild
          [formValue]="formValue"
          [isContract]="true"
          [editable]="false"></pre-base-info-table>
      </div>
    </app-tab>
    <app-tab [title]="'orderv3.pages.contract-examine.history'| translate" id="approval-record">
      <div class="card-body">
        <app-form-section [title]="'orderv3.pages.contract-examine.history'| translate">
          <approval-history-oit [applyId]="applyId">
          </approval-history-oit>
          <app-form-section class="mtb1rem" [title]="'orderv3.pages.pre-order.history-child' | translate">
            <shared-approval-history
              [procInstId]="procInstId"></shared-approval-history>
          </app-form-section>
        </app-form-section>
        <contract-remarks [formValue]="formValue" [remarkFrom]="remarkFromData"></contract-remarks>
      </div>
    </app-tab>
    <app-tab [title]="'orderv3.pages.contract-examine.change'|translate" id="approve-change" *ngIf="changeItem">
      <div class="card-body">
        <approve-change [formValue]="formValue"></approve-change>
      </div>
    </app-tab>
  </app-tabs>
  <div
    *ngIf="flag != 1"
    class="fixed-btn-group"
    nz-row
    nzType="flex"
    nzJustify="center"
    nzAlign="middle">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: center">
          <button [disabled]="tabIndex==0" nz-button nzType="default" (click)="goPreStep()">
            {{"orderv3.pages.contract-examine.pre-step" | translate}}
          </button>
          <button [disabled]="tabIndex==(tabList.length-1)" nz-button nzType="default" (click)="goNextStep()">
            {{"orderv3.pages.contract-examine.next-step" | translate}}
          </button>
          <button nz-button nzType="default" (click)="handleCancel()">
            {{"orderv3.pages.contract-examine.cancel" | translate}}
          </button>
          <button
            nz-button
            nzType="primary"
            nz-popconfirm
            nzTitle="你确定要执行批准的操作?"
            (nzOnConfirm)="preSubmit('approved')">
            {{"orderv3.pages.contract-examine.approved" | translate}}
          </button>
          <button
            nz-button
            nzType="primary"
            nz-popconfirm
            nzTitle="你确定要执行拒绝的操作?"
            (nzOnConfirm)="preSubmit('rejected')">
            {{"orderv3.pages.contract-examine.reject" | translate}}
          </button>

        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div *ngIf="flag == 1" class="fixed-btn-group" nz-row nzType="flex" nzJustify="center" nzAlign="middle">
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: center">
          <button [disabled]="tabIndex==0" nz-button nzType="default" (click)="goPreStep()">
            {{"orderv3.pages.contract-examine.pre-step" | translate}}
          </button>
          <button [disabled]="tabIndex==(tabList.length-1)" nz-button nzType="default" (click)="goNextStep()">
            {{"orderv3.pages.contract-examine.next-step" | translate}}
          </button>
          <button nz-button nzType="default" (click)="handleCancel()">
            {{"orderv3.pages.contract-examine.cancel" | translate}}
          </button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</div>
