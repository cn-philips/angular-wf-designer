<nz-card>
  <app-tabs>
    <app-tab title="Bidding/OIT/Slot Reservation">
      <div style="width: 100%; background-color: #ffffff; padding: 15px 0 15px 0">
        <cos-my-started-search-item [loading]="loading" [formData]="formValues" (search)="updateParams($event)"
          (setLoading)="getLoading($event)" (exportEvent)="exportData()" [exportLoading]="exportLoading">
        </cos-my-started-search-item>
        <cos-my-started-list #table [loading]="loading" [tableData]="tableData" [total]="total" [flag]="1"
          (pageChange)="updateDataList($event)" (setLoading)="getLoading($event)">
        </cos-my-started-list>
      </div>
    </app-tab>

    <app-tab title="Special Approval">
      <div style="width: 100%; background-color: #ffffff; padding: 15px 0 15px 0">
        <special-approval-request></special-approval-request>
      </div>
    </app-tab>
  </app-tabs>
</nz-card>
