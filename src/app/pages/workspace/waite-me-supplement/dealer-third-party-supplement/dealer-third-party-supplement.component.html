<div style="width: 100%; background-color: #ffffff; padding: 15px">
  <form nz-form [formGroup]="formValues">
    <div nz-row nzType="flex" nzJustify="start" nzAlign="middle" style="background-color: #F6F7F9;
    color: #FFFFFF;
    line-height: 22px;
    padding-top: 24px">
      <div nz-col nzXs="24" nzMd="12" nzXl="9">
        <nz-form-item>
          <nz-form-label nzXs="10" nzMd="10" nzXl="8" nzXXl="8">
            随机抽查周期状态
          </nz-form-label>
          <nz-form-control nzXs="14" nzMd="14" nzXl="16" nzXXl="16">
            <nz-select formControlName="status" style="width: 100%" nzShowSearch nzAllowClear nzPlaceHolder="">
              <nz-option *ngFor="let item of randomPickStatus" [nzValue]="item.value"
                [nzLabel]="item.label"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzXs="24" nzMd="12" nzXl="10">
        <nz-form-item>
          <nz-form-label nzXs="12" nzMd="12" nzXl="10">
            随机抽查周期数据时间范围
          </nz-form-label>
          <nz-form-control nzXs="12" nzMd="12" nzXl="14">
            <nz-range-picker formControlName="checkDuration" nzFormat="yyyy-MM-dd"
              [nzPlaceHolder]="['开始日期', '结束日期']"></nz-range-picker>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzXs="24" nzMd="12" nzXl="5">
        <nz-form-item class="btns-group" style="text-align: right">
          <div style="display: flex;justify-content: center;">
            <button nz-button nzType="primary" nzXl="10" nzXXl="6" (click)="updateParams()">
              <i nz-icon type="search"></i>{{"list-pages.search-form.form.search" | translate}}
            </button>
            <button nz-button nzType="default" style="margin-left: 10px;" (click)="resetForm()">
              <i nz-icon nzType="undo" nzTheme="outline"></i>{{"list-pages.search-form.form.clear" | translate}}
            </button>
          </div>
        </nz-form-item>

      </div>
    </div>
  </form>

  <button *ngIf="isOAAdmin" nz-button nzType="primary" style="margin-top: 16px;"
    (click)="toNewRandomCycle()">新建随机抽查周期</button>

  <dealer-third-party-list #table [loading]="loading" [tableData]="tableData" [total]="total" [type]="type"
    [randomStatus]="randomPickStatus" (pageChange)="updateDataList($event)" (setLoading)="getLoading($event)"
    [flag]="0">
  </dealer-third-party-list>
</div>
