<nz-card>
  <app-tabs>
    <app-tab title="Bidding/OIT/Slot Reservation">
      <div
        style="width: 100%; background-color: #ffffff; padding: 15px 0 15px 0"
      >
        <cos-my-done-search-item
          [loading]="loading"
          [formData]="formValues"
          (search)="updateParams($event)"
          (setLoading)="getLoading($event)"
          (exportEvent)="exportData()"
          [exportLoading]="exportLoading"
        >
        </cos-my-done-search-item>
        <cos-my-done-list
          #table
          [loading]="loading"
          [tableData]="tableData"
          [total]="total"
          [flag]="1"
          (pageChange)="updateDataList($event)"
          (setLoading)="getLoading($event)"
        >
        </cos-my-done-list>
      </div>
    </app-tab>

    <app-tab title="Special Approval">
      <div
        style="width: 100%; background-color: #ffffff; padding: 15px 0 15px 0"
      >
        <special-approval-approved></special-approval-approved>
      </div>
    </app-tab>
  </app-tabs>
</nz-card>
