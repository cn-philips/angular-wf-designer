<nz-card class="title_warpper">
  <div>
    <h4 class="font-weight-bold">
      <span>OA Supplemental Information OA补充信息</span>
    </h4>
  </div>
</nz-card>
<igt-approval-flowline></igt-approval-flowline>
<div class="tabs-box">
  <div
    nz-row
    nzType="flex"
    nzJustify="end"
    nzAlign="middle"
    class="tabs-box-actions"
  >
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right">
          <button
            nz-button
            *ngIf="dataBase.detail.flag==1"
            nzType="default"
            (click)="toReturn()"
            style="margin-right: 10px"
          >
            返回
          </button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</div>
<ngb-tabset type="tabs" [destroyOnHide]="false" [activeId]="activedId"  class="nav-tabs-top nav-responsive-xl">
  <ngb-tab id="pending-tab">
    <ng-template ngbTabTitle><span class="tab-title"><strong>Application Details<br> 申请详情</strong></span></ng-template>
    <ng-template ngbTabContent>
      <div class="card-body">
        <div class="demo-vertical-spacing">
          <form #searchForm="ngForm">
            <app-prebase-info
            #childbase
            [disa]="true"
            [dataBase]="dataBase"
            [conTable]="false"
          >
          </app-prebase-info>
          </form>
        </div>
        <div nz-row nzType="flex" nzJustify="end" nzAlign="middle">
          <div nz-col nzSpan="4">
            <nz-form-item>
              <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right;">
                <button nz-button [nzType]="'primary'" (click)="myskip('examine-tab')">Next 下一步</button>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>
    </ng-template>
  </ngb-tab>
  <ngb-tab id="examine-tab">
    <ng-template ngbTabTitle><span class="tab-title"><strong>Product Details<br> 产品信息</strong></span></ng-template>
    <ng-template ngbTabContent>
      <div class="card-body">
        <app-preproduct-info
        [dataBase]="dataBase"
        [ishow]="true"
        [disa]="true"
      ></app-preproduct-info>
        <div nz-row nzType="flex" nzJustify="end" nzAlign="middle">
          <div nz-col nzSpan="4">
            <nz-form-item>
              <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right;">
                <button nz-button [nzType]="'primary'" (click)="myskip('pending-tab')">Back 上一步</button>
                <button nz-button [nzType]="'primary'" (click)="myskip('change-tab')">Next下一步</button>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>
    </ng-template>
  </ngb-tab>
  <ngb-tab id="change-tab">
    <ng-template ngbTabTitle><span class="tab-title"><strong>Review<br> 审核</strong></span></ng-template>
    <ng-template ngbTabContent>
      <div class="card-body">
         <app-supply-form [disa]="disa"  [dataBase]="dataBase">
         </app-supply-form>
         <nz-card class="mtb1rem" nzTitle="Approved History 审批记录">
          <app-emp-acc></app-emp-acc>
        </nz-card>
         <div nz-row nzType="flex" nzJustify="end" nzAlign="middle">
          <div nz-col nzSpan="4">
            <nz-form-item>
              <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right;">
                <button nz-button [nzType]="'primary'" (click)="myskip('examine-tab')">Back 上一步</button>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>
    </ng-template>
  </ngb-tab>
</ngb-tabset>
