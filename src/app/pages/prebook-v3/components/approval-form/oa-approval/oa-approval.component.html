<form nz-form [formGroup]="oaApproval">
  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzXs="24" nzSm="24" nzMd="12" nzLg="8">
      <nz-form-item>
        <nz-form-label nzXs="24" nzSm="24" nzMd="8" nzRequired>出口管制</nz-form-label>
        <nz-form-control nzXs="24" nzSm="24" nzMd="14">
          <shared-upload-file type="button" title="上传附件" formControlName="exportControl"></shared-upload-file>
          <nz-form-explain *ngIf="oaApproval.get('exportControl')?.dirty && oaApproval.get('exportControl')?.errors">
            {{"biddingv3.components.basic-info.required" | translate}}
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>

  <div nz-row nzType="flex" nzJustify="start" nzAlign="middle">
    <div nz-col nzXs="24" nzSm="24" nzMd="12" nzLg="8">
      <nz-form-item>
        <nz-form-label nzXs="24" nzSm="24" nzMd="8" [nzRequired]="!isUsProcess">备货协议草稿</nz-form-label>
        <nz-form-control nzXs="24" nzSm="24" nzMd="14">
          <shared-upload-file type="button" title="上传附件" formControlName="stockingAgreementDraft"></shared-upload-file>
          <nz-form-explain *ngIf="oaApproval.get('stockingAgreementDraft')?.dirty && oaApproval.get('stockingAgreementDraft')?.errors">
            {{"biddingv3.components.basic-info.required" | translate}}
          </nz-form-explain>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</form>
