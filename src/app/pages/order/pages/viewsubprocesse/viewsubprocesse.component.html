<nz-card class="title_warpper">
  <div>
    <h4 class="font-weight-bold">
      <span>Contract Subprocess 合同子流程</span>
    </h4>
  </div>
</nz-card>
<igt-approval-flowline></igt-approval-flowline>
<hr class="border-light container-m--x mt-0 mb-4">
<div class="tabs-box">
  <div
    nz-row
    nzType="flex"
    nzJustify="end"
    nzAlign="middle"
    class="tabs-box-actions"
  >
    <div nz-col nzSpan="24">
      <nz-form-item>
        <nz-form-control [nzSm]="24" [nzXs]="24" style="text-align: right">
          <button
            nz-button
            *ngIf="dataBase.detail.flag==1"
            nzType="default"
            (click)="toReturn()"
            style="margin-right: 10px"
          >
            Return 返回
          </button>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
</div>
<ngb-tabset type="tabs" [destroyOnHide]="false" class="nav-tabs-top nav-responsive-xl">
  <ngb-tab id="pending-tab">
    <ng-template ngbTabTitle><span class="tab-title"><strong>General Information<br> 基础信息</strong></span></ng-template>
    <ng-template ngbTabContent>
      <div class="card-body">
        <div class="demo-vertical-spacing">
          <form>
            <app-preOrderBaseInfo [(dataBase)]="dataBase" [disa]="true"></app-preOrderBaseInfo>
          </form>
        </div>
      </div>
    </ng-template>
  </ngb-tab>
  <ngb-tab id="complete-tab">
    <ng-template ngbTabTitle><span class="tab-title"><strong>Product Details<br> 产品信息</strong></span></ng-template>
    <ng-template ngbTabContent>
      <div class="card-body">
        <app-preOrderProductInfo [dataBase]="dataBase" [disaend]="true" [sofonoff]="true" [disa]="true" [ishow]="true"></app-preOrderProductInfo>
      </div>
    </ng-template>
  </ngb-tab>
  <ngb-tab id="complete-audit">
    <ng-template ngbTabTitle><span class="tab-title"><strong>Approval<br> 审批</strong></span></ng-template>
    <ng-template ngbTabContent>
      <div class="card-body">
        <nz-card class="mtb1rem" nzTitle="Approved History 审批记录">
          <app-emp-acc></app-emp-acc>
        </nz-card>
      </div>
    </ng-template>
  </ngb-tab>
</ngb-tabset>
