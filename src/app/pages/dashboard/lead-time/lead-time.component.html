<nz-card class="title_warpper mb-4">
  <div>
    <h4 class="font-weight-bold">
      <span>{{ "dashboard.leadTimeAnalysis" | translate }}</span>
    </h4>
  </div>
</nz-card>

<nz-card>
  <form nz-form [formGroup]="formValues" (ngSubmit)="onExportData()">
    <div nz-row>
      <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="year">Modality</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-checkbox-group formControlName="modalityList"></nz-checkbox-group>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="year">{{ "dashboard.year" | translate }}</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-year-picker style="width:100%" [nzStyle]="{width:'100%'}" id="year" nzFormat="yyyy" formControlName="year" nzPlaceHolder="" (ngModelChange)="onYearChange($event)"></nz-year-picker>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzMd]="8" [nzSm]="12" [nzXs]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="month">{{ "dashboard.month" | translate }}</nz-form-label>
          <nz-form-control [nzSm]="18" [nzXs]="24">
            <nz-select
              id="month"
              formControlName="month"
              nzAllowClear
              style="width:100%"
            >
              <nz-option *ngIf="months.length === 0" nzDisabled [nzLabel]="'dashboard.selectYearFirst' | translate"></nz-option>
              <nz-option *ngFor="let month of months" [nzValue]="month.value" [nzLabel]="month.label" [nzDisabled]="month.disabled"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzMd]="24" [nzSm]="12" [nzXs]="24" style="text-align:right;">
        <nz-form-item>
          <nz-form-control [nzOffset]="4">
            <button nz-button nzType="primary" [nzLoading]="exportBtnLoading">{{ "dashboard.export" | translate }}</button>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </form>

</nz-card>
