<div class="alert-wrapper" *ngIf="visible">
  <div class="alert-body">
    <div class="alert-side"></div>
    <div class="alert-content">
      <div class="alert-content-header">
        <i
          style="cursor: pointer"
          (click)="hide()"
          nz-icon
          nzType="close"
          nzTheme="outline"
          *ngIf="!activeMessage.forceRead"
        ></i>
      </div>
      <div class="alert-content-body">
        <div class="alert-content-body-title">{{ activeMessage.title }}</div>
        <div class="alert-content-body-text">
          {{ activeMessage.content }}
        </div>
      </div>
      <div class="alert-content-footer">
        <button
          (click)="handleConfirm()"
          nz-button
          nzType="primary"
          [disabled]="currentCountDown !== 0"
        >
          {{ buttonText }}
        </button>
      </div>
    </div>
  </div>
  <div class="alert-shadow"></div>
</div>
