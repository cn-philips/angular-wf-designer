<div style="margin-right: 20px">
  <ng-content></ng-content>
</div>

<i
  nz-icon
  nz-popover
  [nzContent]="templateContent"
  nzType="question-circle"
  nzTheme="outline"
  [nzPlacement]="utils.isMobile() ? 'topRight' : 'top'"
  style="
    cursor: pointer;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
  "
></i>

<ng-template #templateContent>
  <div class="aaa" [ngStyle]="{ maxWidth: this.maxWidth, width: this.width }">
    <ng-container [ngTemplateOutlet]="this.contentTpl?.templateRef">
    </ng-container>
  </div>
</ng-template>
