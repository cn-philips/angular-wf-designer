<nz-card nzTitle="订单信息">
  <header *ngIf="editable">
    <button nz-button nzType="primary" (click)="createOrder()">+ 新建订单信息</button>
    <nz-upload nzAction="" [nzShowUploadList]="false" [nzBeforeUpload]="onImportOrderInfo">
      <button nz-button nzType="link">
        <i nz-icon nzType="import" nzTheme="outline"></i>
        批量导入
      </button>
    </nz-upload>
    <a [href]="templateUrl" download="de-book.xlsx">De-book信息导入模板.xlsx</a>
  </header>

  <div class="table-container">
    <nz-table
      nzBordered
      nzSize="small"
      [nzData]="formValues.value"
      [nzFrontPagination]="false"
      [nzShowPagination]="false"
      [nzScroll]="{ x: '1000px' }"
    >
      <thead>
      <tr>
        <th nzWidth="200px" *ngIf="false">产品型号</th>
        <th nzWidth="150px">产品线</th>
        <th nzWidth="150px">BG(Modality)</th>
        <th nzWidth="300px">销售区域</th>
        <th nzWidth="300px">医院编号</th>
        <th nzWidth="400px">医院名称</th>
        <th nzWidth="150px">进单日期</th>
        <th nzWidth="150px">合同金额</th>
        <th nzWidth="120px">币制</th>
        <th nzWidth="150px">De-Book原因</th>
        <th nzWidth="150px">Remark</th>
        <th nzWidth="200px">SAP 订单号(SO#)</th>
        <th nzWidth="250px">产品型号</th>
        <th nzWidth="150px">订单WBS#</th>
        <th nzWidth="150px" nzRight="0px">Action</th>
      </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of formValues.value;let index = index">
          <td *ngIf="false">
            <nz-form-item>
              <nz-form-control>
                <input nz-input [(ngModel)]="data.productType" [disabled]="!editable" />
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <nz-select [(ngModel)]="data.bmc" style="width: 100%;" *ngIf="editable" required>
                  <nz-option *ngFor="let item of selectOptions.bmcs[index]" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                </nz-select>
                <input nz-input [(ngModel)]="data.bmc" [disabled]="!editable" *ngIf="!editable"  />
                <nz-form-explain class="error-msg" *ngIf="!data.bmc">
                  请选择产品线
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                              <nz-select [(ngModel)]="data.bg" style="width: 100%;" [disabled]="!editable" (ngModelChange)="onBgChange($event, data,index)" required>
                                <nz-option *ngFor="let item of BG_LIST" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                              </nz-select>
<!--                <input nz-input [(ngModel)]="data.bg" disabled />-->

              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <nz-select style="width: 48%;" [(ngModel)]="data.cycleGroup" (ngModelChange)="onCycleGroupChange(data)" [disabled]="!editable" required>
                  <nz-option *ngFor="let item of spService.cycleGroups" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                </nz-select>
                <nz-select style="width: 48%;" [(ngModel)]="data.bigArea" [disabled]="!editable" required>
                  <nz-option *ngFor="let item of spService.cycleGroupBigAreaMap[data.cycleGroup]" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <input nz-input [(ngModel)]="data.hospitalNo" [disabled]="true" />
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <nz-input-group style="width: 100%" [nzSuffix]="clearHospitalBtn" [nzAddOnAfter]="selectHospitalBtn">
                  <input type="text" nz-input [ngModel]="data.hospitalName" [placeholder]="editable ? '点击右侧按钮选择医院' : ''" disabled />
                </nz-input-group>
                <ng-template #clearHospitalBtn>
                  <i nz-icon nz-tooltip class="ant-input-clear-icon" nzTheme="fill" nzType="close-circle" *ngIf="!data.hospitalLoading && data.hospitalName && editable" (click)="onClearHospital(data)"></i>
                </ng-template>

                <ng-template #selectHospitalBtn>
                  <i *ngIf="data.hospitalLoading" nz-icon nzType="loading" nzTheme="outline"></i>
                  <button nz-button nzType="primary" class="ml-md" (click)="onShowSelectHospitalModal(data)" [disabled]="!editable">选择医院</button>
                </ng-template>

                <nz-form-explain class="error-msg">
                  <ng-container *ngIf="data.hospitalError">
                    医院数据验证失败, 请重新选择
                  </ng-container>
                  <ng-container *ngIf="!data.hospitalError">
                    <ng-container *ngIf="data.businessModel === BUSINESS_MODEL.DISTRIBUTOR_DEAL && !data.dealerCode && !data.hospitalNo">
                      请选择医院或者经销商
                    </ng-container>
                    <ng-container *ngIf="data.businessModel !== BUSINESS_MODEL.DISTRIBUTOR_DEAL && !data.hospitalNo">
                      请选择医院
                    </ng-container>
                  </ng-container>
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <nz-date-picker
                  [(ngModel)]="data.orderDate"
                  style="width: 100%"
                  [nzStyle]="{ width: '100%' }"
                  [disabled]="!editable"
                  [nzPlaceHolder]="editable ? '请选择日期' : ''"
                ></nz-date-picker>
                <nz-form-explain class="error-msg" *ngIf="!data.orderDate">
                  请选择进单日期
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <input nz-input type="number" [(ngModel)]="data.orderAmount" [disabled]="!editable" required/>
              </nz-form-control>
              <nz-form-explain class="error-msg" *ngIf="!data.orderAmount">
                请填写合同金额
              </nz-form-explain>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <nz-select [(ngModel)]="data.currency" style="width: 100%;" [disabled]="!editable" required>
                  <nz-option *ngFor="let item of selectOptions.currencies" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                </nz-select>
                <nz-form-explain class="error-msg" *ngIf="!data.currency">
                  请选择币制
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <nz-select [(ngModel)]="data.deBookReason" style="width: 100%;" [disabled]="!editable" required>
                  <nz-option *ngFor="let item of debookReasonList" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                </nz-select>
                <nz-form-explain class="error-msg" *ngIf="!data.deBookReason">
                  请选择De-Book原因
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <input nz-input [(ngModel)]="data.remark" [disabled]="!editable" [title]="data.remark" />
                <nz-form-explain class="error-msg" *ngIf="!data.remark">
                  请填写Remark
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <input nz-input [(ngModel)]="data.sapOrderNo" [disabled]="!editable" required/>
              </nz-form-control>
              <nz-form-explain class="error-msg" *ngIf="!data.sapOrderNo">
                请填写SAP订单号
              </nz-form-explain>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <input nz-input *ngIf=" data.bg !== 'US'" [(ngModel)]="data.productType1" [disabled]="!editable"  required/>
                <nz-select *ngIf="data.bg === 'US'" [(ngModel)]="data.productType1" style="width: 100%;" (ngModelChange)="onProductChange($event, data)" [disabled]="!editable" nzMode="multiple" required >
                  <nz-option *ngFor="let item of usProductList" [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                </nz-select>
                <nz-form-explain class="error-msg" *ngIf="!data.productType1">
                  请填写产品型号
                </nz-form-explain>
              </nz-form-control>
            </nz-form-item>
          </td>
          <td>
            <nz-form-item>
              <nz-form-control>
                <input nz-input [(ngModel)]="data.wbsNo" [disabled]="!editable" required/>
              </nz-form-control>
              <nz-form-explain class="error-msg" *ngIf="!data.wbsNo">
                请填写订单WBS#
              </nz-form-explain>
            </nz-form-item>
          </td>
          <td nzRight="0px">
<!--            <a nz-icon nzType="edit" nzTheme="outline" style="font-size: 16px"></a>&emsp;-->
            <a nz-icon nzType="delete" nzTheme="outline" style="font-size: 16px" (click)="deleteOrder(data, index)"></a>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

</nz-card>


<app-select-hospital #selectHospital (select)="onSelectHospital($event)"></app-select-hospital>
