<h4 class="font-weight-bold py-3 mb-4">
  <!--<span class="text-muted font-weight-light">Tables /</span>-->  角色管理
</h4>
<hr class="border-light container-m--x mt-0 mb-4">
<nz-modal [nzVisible]="modalAttribute.isVisible" [nzTitle]="modalAttribute.title" nzWidth="800"
          (nzOnCancel)="modalAttribute.modalCancel()" (nzOnOk)="modalAttribute.modalOk()">
  <form nz-form [formGroup]="modalAttribute.modalForm">
    <input formControlName="id" type="hidden"/>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="modalName">名称</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="name" id="modalName"/>
            <nz-form-explain
              *ngIf="modalAttribute.modalForm.get('name')?.dirty && modalAttribute.modalForm.get('name')?.errors">
              名称必填
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="modalRoleCode">标识</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="roleCode" id="modalRoleCode"/>
            <nz-form-explain
              *ngIf="modalAttribute.modalForm.get('roleCode')?.dirty && modalAttribute.modalForm.get('roleCode')?.errors">
              标识必填
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="modalGroup">角色组</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <nz-select
              nzShowSearch
              nzServerSearch
              nzPlaceHolder="input search text"
              formControlName="group"
              id="modalGroup"
              [nzShowArrow]="false"
            >
              <nz-option *ngFor="let option of modalAttribute.modalListOfGroup" [nzLabel]="option.text"
                         [nzValue]="option.value"></nz-option>
            </nz-select>
            <nz-form-explain
              *ngIf="modalAttribute.modalForm.get('role')?.dirty && modalAttribute.modalForm.get('role')?.errors">
              所属角色组必填
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="modalDescription">描述</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
          <textarea nz-input
                    formControlName="description"
                    id="modalDescription"
                    [nzAutosize]="{ minRows: 2, maxRows: 6 }"></textarea>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

  </form>
  <div class="table-operations">
    <nz-select
      [(ngModel)]="modalAttribute.selectedUser"
      style="width: 200px;"
      nzShowSearch
      nzServerSearch
      nzPlaceHolder="搜索用户"
      [nzShowArrow]="false"
      (nzOnSearch)="modalAttribute.searchUser($event)"
    >
      <nz-option *ngFor="let option of modalAttribute.userList" [nzLabel]="option.text"
                 [nzValue]="option"></nz-option>
    </nz-select>
    <button nz-button nzType="primary" nzSearch (click)="modalAttribute.addUser()">添加</button>
  </div>
  <nz-table #selectedUserTable nzSize="small" [nzData]="modalAttribute.referenceUserList">
    <thead>
    <tr>
      <th>Code</th>
      <th>姓名</th>
      <th>邮箱</th>
      <th>电话</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let data of selectedUserTable.data">
      <td>{{ data.code }}</td>
      <td>{{ data.name }}</td>
      <td>{{ data.email }}</td>
      <td>{{ data.phone }}</td>
      <td>
        <a nz-icon type="delete" title="移除" nz-popconfirm nzTitle="删除"
           (nzOnConfirm)="modalAttribute.removeUser(data)"></a>
      </td>
    </tr>
    </tbody>
  </nz-table>
</nz-modal>
<div class="demo-vertical-spacing">
  <div>
    <nz-card nzTitle="搜索" style="margin-bottom: 20px">
      <form nz-form [formGroup]="queryParams.queryForm" class="ant-advanced-search-form">
        <div nz-row [nzGutter]="24">
          <div nz-col [nzSpan]="6">
            <nz-form-item nzFlex>
              <nz-form-label nzFor="roleCode">标识</nz-form-label>
              <nz-form-control>
                <input nz-input formControlName="roleCode" id="roleCode"/>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col [nzSpan]="6">
            <nz-form-item nzFlex>
              <nz-form-label nzFor="roleName">名称</nz-form-label>
              <nz-form-control>
                <input nz-input formControlName="roleName" id="roleName"/>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div nz-col [nzSpan]="6">
            <nz-form-item nzFlex>
              <nz-form-label nzFor="group">角色组</nz-form-label>
              <nz-form-control>
                <nz-select style="width: 150px;" nzShowSearch nzServerSearch formControlName="group" id="group"
                           [nzShowArrow]="false">
                  <nz-option *ngFor="let option of listOfGroup"
                             [nzLabel]="option.text"
                             [nzValue]="option.value">
                  </nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
        <div nz-row>
          <div nz-col nzSpan="24" style="text-align: right;">
            <button nz-button nzType="primary" >查询</button>
            <button nz-button >重置</button>
          </div>
        </div>
      </form>
    </nz-card>

    <div>
      <div class="table-operations">
        <button nz-button nzType="primary" >新增</button>
      </div>
      <nz-table #roleTable
                [nzData]="listOfRole"
                [nzFrontPagination]="false"
                [nzTotal]="queryParams.total"
                [nzPageIndex]="queryParams.pageIndex"
                [nzPageSize]="queryParams.pageSize"
                [nzShowTotal]="rangeTemplate"
                [nzLoading]="queryParams.loading"
                [nzShowSizeChanger]="true"
                [nzPageSizeOptions]="[10,20,50,100]">
        <ng-template #rangeTemplate let-range="range" let-total>
          {{ range[0] }}-{{ range[1] }} 共 {{ total }}
        </ng-template>
        <thead>
        <tr>
          <th>标识</th>
          <th>名称</th>
          <th>角色组</th>
          <th>描述信息</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let data of roleTable.data">
          <td>{{data.roleCode}}</td>
          <td>{{data.name}}</td>
          <td>{{data.group ? data.group.name : ''}}</td>
          <td>{{data.description}}</td>
          <td>
            <a nz-icon type="edit" title="编辑" (click)="editRole(data)"></a>
            <nz-divider nzType="vertical"></nz-divider>
            <a nz-icon type="delete" title="移除" nz-popconfirm nzTitle="删除" (nzOnConfirm)="removeRole(data)"></a>
          </td>
        </tr>
        </tbody>
      </nz-table>
    </div>


  </div>
</div>
