<h4 class="font-weight-bold py-3 mb-4">
  人员管理
</h4>
<!-- <app-person-manage-modal></app-person-manage-modal> -->
<!-- Modal -->
<nz-modal [nzVisible]="modalAttribute.isVisible" [nzTitle]="modalAttribute.title" nzWidth="800"
          (nzOnCancel)="modalAttribute.modalCancel()" (nzOnOk)="modalAttribute.modalOk()">
  <form nz-form [formGroup]="modalAttribute.modalForm">
    <input formControlName="id" type="hidden"/>
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="24">
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="modalCode">code1</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="code" id="modalCode"/>
            <nz-form-explain
              *ngIf="modalAttribute.modalForm.get('name')?.dirty && modalAttribute.modalForm.get('name')?.errors">
              code1必填
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="modalName">姓名</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="name" id="modalName"/>
            <nz-form-explain
              *ngIf="modalAttribute.modalForm.get('name')?.dirty && modalAttribute.modalForm.get('name')?.errors">
              姓名必填
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired nzFor="modalEmail">邮件</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="email" id="modalEmail"/>
            <nz-form-explain
              *ngIf="modalAttribute.modalForm.get('name')?.dirty && modalAttribute.modalForm.get('name')?.errors">
              邮件必填
            </nz-form-explain>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="modalPhone">电话</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="phone" id="modalPhone"/>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label [nzSm]="6" [nzXs]="24" nzFor="modalSapCode">SapCode</nz-form-label>
          <nz-form-control [nzSm]="14" [nzXs]="24">
            <input nz-input formControlName="sapCode" id="modalSapCode" />
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

  </form>
</nz-modal>
<!-- Search filter -->
<nz-card nzTitle="搜索" style="margin-bottom: 20px">
  <form nz-form [formGroup]="queryParams.queryForm" class="ant-advanced-search-form">
    <div nz-row [nzGutter]="24">
      <div nz-col [nzSpan]="6">
        <nz-form-item nzFlex>
          <nz-form-label nzFor="code">code1</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="code" id="code"/>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="6">
        <nz-form-item nzFlex>
          <nz-form-label nzFor="name">姓名</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="name" id="name"/>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="6">
        <nz-form-item nzFlex>
          <nz-form-label nzFor="email">邮箱</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="email" id="email"/>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col [nzSpan]="6">
        <nz-form-item nzFlex>
          <nz-form-label nzFor="sapCode">SapCode</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="sapCode" id="sapCode" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="24" style="text-align: right;">
        <button nz-button nzType="primary" (click)="queryForm()">查询</button>
        <button nz-button (click)="resetQueryForm()">重置</button>
      </div>
    </div>
  </form>
</nz-card>
<!-- add Personal button-->
<div class="table-operations" style="margin-bottom: 15px;">
  <button nz-button nzType="primary" (click)="addPersonal()">新增</button>
</div>
<!-- Show table -->
<nz-table #editRowTable [nzData]="listOfData">
  <thead>
  <tr>
    <th>状态</th>
    <th>code1</th>
    <th>名字</th>
    <th>邮箱</th>
    <th>电话</th>
    <th>SapCode</th>
    <th>操作</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let data of editRowTable.data">
    <td>
      <a nz-icon
         *ngIf="data.disabled"
         nzType="lock"
         style="color: red;"
         nzTheme="outline"
         title="已禁用用户"></a>
      <a nz-icon
         *ngIf="!data.disabled"
         nzType="unlock"
         style="color: green;"
         nzTheme="outline"
         title="已启用用户"></a>
    </td>
    <td>{{data.code}}</td>
    <td>{{data.name}}</td>
    <td>{{data.email}}</td>
    <td>{{data.phone}}</td>
    <td>{{data.sapCode}}</td>
    <td>
      <a *ngIf="!data.disabled" nz-icon type="edit" title="编辑" (click)="editPersonals(data)"></a>
      <nz-divider nzType="vertical"></nz-divider>
      <a *ngIf="!data.disabled" nz-icon type="lock" title="禁用" nz-popconfirm nzTitle="禁用"
         (nzOnConfirm)="disabledPersonals(data)"></a>
      <a *ngIf="data.disabled" nz-icon type="unlock" title="启用" nz-popconfirm nzTitle="启用"
         (nzOnConfirm)="enablePersonals(data)"></a>
    </td>
  </tr>
  </tbody>
</nz-table>
